name: Construire APK Android

# 1. vérifie que les fichiers générés correspondent aux sources (src/) + analyse ESLint
# 2. teste le jeu dans Chromium (Playwright)
# 3. compile l'APK RELEASE avec Gradle et le SDK Android officiel, le vérifie
# 4. le publie dans la Release « apk-latest » (téléchargement direct depuis le téléphone)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write # nécessaire pour publier l'APK dans « Releases »

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_RELEASE_KEY: ${{ secrets.NEF_KEYSTORE_BASE64 != '' }}
      APK_NAME: NumeroEnFuite.apk
      # Empreinte SHA-256 du certificat permanent (information publique). Avec la clé des secrets,
      # la CI refuse de publier un APK signé par une autre clé : les mises à jour restent possibles.
      EXPECTED_CERT_SHA256: '7675162db885ba8fc9f22d297d629e417c564be715b7775122fca5a56ab3c822'
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # ---------- 1. Qualité du code ----------
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Installer les outils (versions figées par package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Fichiers générés à jour, format et analyse statique
        run: npm run check

      # ---------- 2. Tests automatiques du jeu (navigateur Chromium sans écran) ----------
      - name: Tester le jeu (1 à 4 joueurs, 4 niveaux, 3 langues, défi, film, sauvegarde)
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Publier les captures d'écran des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran-tests
          path: test-screenshots/
          if-no-files-found: ignore

      # ---------- 3. Compilation Android officielle (Gradle + SDK Google) ----------
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android officiel (Google) — plateforme 35
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "Installation des command-line tools Android depuis dl.google.com"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # Clé de signature : celle des secrets GitHub si elle existe (mises à jour sans
      # désinstaller), sinon une clé temporaire créée pour cette compilation seulement.
      - name: Préparer la clé de signature
        env:
          NEF_KEYSTORE_BASE64: ${{ secrets.NEF_KEYSTORE_BASE64 }}
          NEF_KEYSTORE_PASSWORD: ${{ secrets.NEF_KEYSTORE_PASSWORD }}
          NEF_KEY_ALIAS: ${{ secrets.NEF_KEY_ALIAS }}
          NEF_KEY_PASSWORD: ${{ secrets.NEF_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "$NEF_KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "NEF_KEYSTORE_PASSWORD=$NEF_KEYSTORE_PASSWORD"
              echo "NEF_KEY_ALIAS=$NEF_KEY_ALIAS"
              echo "NEF_KEY_PASSWORD=$NEF_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Clé permanente (secrets GitHub)."
          else
            PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
              -alias numero -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Le Numero en fuite, O=Atelier familial" > /dev/null
            {
              echo "NEF_KEYSTORE_PASSWORD=$PASS"
              echo "NEF_KEY_ALIAS=numero"
              echo "NEF_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            echo "::warning::Pas de secret NEF_KEYSTORE_BASE64 : APK signé avec une clé temporaire (désinstaller l'ancienne version avant chaque mise à jour)."
          fi
          echo "NEF_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Compiler l'APK release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          rm -f "$NEF_KEYSTORE_FILE"

      # ---------- 4. Vérifications de l'APK produit ----------
      - name: Vérifier l'APK (signature, manifeste, non débogable, contenu)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          echo "== Taille ==";      ls -lh "$APK"
          echo "== Alignement =="; "$BT/zipalign" -c -v 4 "$APK" | tail -1
          echo "== Signature ==";   "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/certs.txt
          CERT="$(grep -m1 'certificate SHA-256 digest' /tmp/certs.txt | awk '{print $NF}')"
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          if [ "$HAS_RELEASE_KEY" = "true" ] && [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Certificat $CERT différent de la clé permanente attendue : APK non publié."; exit 1
          fi
          BADGING="$("$BT/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|application-label"
          if echo "$BADGING" | grep -q "application-debuggable"; then echo "::error::APK débogable"; exit 1; fi
          echo "$BADGING" | grep -q "package: name='com.atelier.numeroenfuite'"
          unzip -l "$APK" | grep -q "assets/index.html"
          echo "APK release, non débogable, jeu embarqué."
          mkdir -p livraison
          cp "$APK" "livraison/$APK_NAME"
          (cd livraison && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NumeroEnFuite-APK
          path: livraison/

      - name: Publier l'APK dans « Releases » (téléchargement direct depuis le téléphone)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apk-latest
          VERSION="$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            NOTE="Signé avec la clé permanente : la mise à jour s'installe par-dessus l'ancienne version."
          else
            NOTE="Signé avec une clé temporaire : désinstallez d'abord l'ancienne version du jeu."
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "livraison/$APK_NAME" "livraison/$APK_NAME.sha256" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Le Numéro en fuite $VERSION" \
            --notes "APK release compilé automatiquement (Gradle + SDK Android officiel), vérifié par apksigner et aapt2. $NOTE Certificat SHA-256 : $CERT_SHA256. Commit : $GITHUB_SHA."
