name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write   # nécessaire pour publier l'APK dans « Releases »

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_RELEASE_KEY: ${{ secrets.NEF_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # ---------- 1. Tests automatiques du jeu (navigateur Chromium sans écran) ----------
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tester le jeu (1 à 4 joueurs, 3 niveaux, 3 langues, sauvegarde)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/game.test.cjs app/src/main/assets/index.html test-screenshots
      - name: Publier les captures d'écran des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran-tests
          path: test-screenshots/
          if-no-files-found: ignore

      # ---------- 2. Compilation Android officielle (Gradle + SDK Google) ----------
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android officiel (Google) — plateforme 35
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "Installation des command-line tools Android depuis dl.google.com"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # ---------- 3. Vérifications de l'APK produit ----------
      - name: Vérifier l'APK (signature, manifeste, contenu)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          echo "== Taille ==";      ls -lh "$APK"
          echo "== Alignement =="; "$BT/zipalign" -c -v 4 "$APK" | tail -1
          echo "== Signature ==";   "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "== Manifeste ==";   "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|application-label"
          unzip -l "$APK" | grep -q "assets/index.html"
          echo "Le jeu est bien embarqué dans l'APK."
          mkdir -p livraison
          cp "$APK" livraison/NumeroEnFuite-V6-debug.apk
          (cd livraison && sha256sum NumeroEnFuite-V6-debug.apk > NumeroEnFuite-V6-debug.apk.sha256)

      - name: Télécharger l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: NumeroEnFuite-V6-APK-debug
          path: livraison/

      - name: Publier l'APK dans « Releases » (téléchargement direct depuis le téléphone)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apk-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" livraison/NumeroEnFuite-V6-debug.apk livraison/NumeroEnFuite-V6-debug.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Le Numéro en fuite V6 — APK de test" \
            --notes "APK debug compilé automatiquement (Gradle + SDK Android officiel), vérifié par apksigner et aapt2. Commit : $GITHUB_SHA. Désinstallez d'abord toute ancienne version du jeu."

      # ---------- 4. (Facultatif) APK release signé avec VOTRE clé ----------
      # Ne s'exécute que si les secrets NEF_KEYSTORE_BASE64, NEF_KEYSTORE_PASSWORD,
      # NEF_KEY_ALIAS et NEF_KEY_PASSWORD sont définis dans le dépôt (voir README).
      - name: Compiler l'APK release signé
        env:
          NEF_KEYSTORE_BASE64: ${{ secrets.NEF_KEYSTORE_BASE64 }}
          NEF_KEYSTORE_PASSWORD: ${{ secrets.NEF_KEYSTORE_PASSWORD }}
          NEF_KEY_ALIAS: ${{ secrets.NEF_KEY_ALIAS }}
          NEF_KEY_PASSWORD: ${{ secrets.NEF_KEY_PASSWORD }}
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          echo "$NEF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export NEF_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p livraison-release
          cp app/build/outputs/apk/release/app-release.apk livraison-release/NumeroEnFuite-V6-release.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Télécharger l'APK release
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NumeroEnFuite-V6-APK-release
          path: livraison-release/
