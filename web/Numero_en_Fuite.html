  --green: #30c973;
  --greenDark: #149950;
  --purple: #7d67ee;
  --purpleDark: #4d37b8;
  --cream: #fffdf7;
  --line: #203063;
  font-family:
    'Baloo',
    system-ui,
    -apple-system,
    'Segoe UI',
    Roboto,
    Tahoma,
    Arial,
    sans-serif;
  color: var(--ink);
  background: #2f6bff;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  min-height: 100%;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #2f6bff;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 8%, #ffffff2e 0 70px, transparent 71px),
    radial-gradient(circle at 92% 26%, #ffffff1f 0 95px, transparent 96px),
    radial-gradient(circle at 18% 72%, #ffffff17 0 130px, transparent 131px),
    radial-gradient(circle at 88% 92%, #ffd84d26 0 110px, transparent 111px),
    radial-gradient(#ffffff24 1.6px, transparent 1.7px) 0 0/24px 24px,
    linear-gradient(172deg, #2a5cf5 0%, #3b86ff 48%, #4fc0ff 100%);
}
button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 2px;
}
#app {
  width: min(100%, 560px);
  min-height: 100dvh;
  margin: 0 auto;
  padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
}
.top,
.row,
.turn-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.top {
  min-height: 52px;
}
.top-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  background: #ffd84d;
  border: 4px solid var(--line);
  border-radius: 18px;
  padding: 7px 11px;
  box-shadow: 0 6px 0 #1d2b5b22;
}
.brand-icon {
  display: grid;
  place-items: center;
  flex: 0 0 42px;
  height: 42px;
  border-radius: 14px;
  background: #8a70ff;
  color: #fff;
  font-size: 20px;
  font-weight: 800;
  border: 3px solid var(--line);
  box-shadow: 0 4px 0 #5641c8;
}
.brand b {
  display: block;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  max-width: 235px;
  text-shadow: 0 1px 0 #fff;
}
.brand small {
  font-size: 9px;
  display: block;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: #44515e;
  line-height: 1.2;
  margin-bottom: 3px;
}
.hero {
  text-align: center;
  padding: 10px 0 6px;
}
.hero h1 {
  color: #fff;
  font-size: clamp(31px, 8vw, 44px);
  line-height: 1.05;
  letter-spacing: -0.05em;
  margin: 7px 0 10px;
  font-weight: 800;
  text-shadow: 0 4px 0 #2a3768;
}
.hero h1 span {
  color: #ffd84d;
}
.intro {
  font-size: 16px;
  color: #f2f7ff;
  line-height: 1.5;
  max-width: 390px;
  margin: 8px auto 13px;
  font-weight: 500;
}
.hero-mascot {
  display: grid;
  place-items: center;
  height: 165px;
}
.panel {
  background: var(--panel);
  border: 4px solid var(--line);
  border-radius: 28px;
  padding: 16px;
  margin: 14px 0;
  box-shadow:
    0 7px 0 #2633641a,
    0 18px 28px #15331b24;
}
.panel.alt {
  background: #f2f8ff;
}
.label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #4b5795;
  font-weight: 800;
}
.panel-title {
  font-size: 21px;
  color: var(--ink);
  line-height: 1.18;
  font-weight: 800;
  margin: 4px 0 8px;
  letter-spacing: -0.02em;
}
.centered {
  text-align: center;
}
.sub {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.5;
  margin: 6px 0;
  font-weight: 500;
}
.selector {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin: 12px 0 18px;
}
.seg,
.level,
.actiontab,
.score,
.tag,
.banner,
.help-detail,
.movement,
.history-items > div,
.lang-choice,
.qbtn,
.mathbox,
.score,
.numtile {
  border: 3px solid var(--line);
}
.seg {
  background: #fff;
  color: var(--ink);
  border-radius: 18px;
  padding: 9px 2px;
  min-height: 68px;
  display: grid;
  place-content: center;
  gap: 1px;
  box-shadow: 0 4px 0 #cfd7fb;
}
.seg b {
  font-size: 24px;
  line-height: 1.2;
}
.seg small {
  font-size: 10px;
  font-weight: 700;
}
.seg.is-selected {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 4px 0 var(--blueDark);
}
.difficulty {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0 19px;
}
.level {
  background: #fff;
  border-radius: 18px;
  text-align: center;
  min-height: 116px;
  padding: 10px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  box-shadow: 0 4px 0 #cfd7fb;
}
.level-emoji {
  font-size: 22px;
}
.level strong {
  font-size: 14px;
  line-height: 1.2;
}
.level small {
  font-size: 10px;
  line-height: 1.35;
  color: #55606f;
  font-weight: 500;
}
.level.is-selected {
  background: #fff7cb;
  box-shadow: 0 4px 0 #d3b244;
}
.bigbtn,
.mini-btn {
  border: 4px solid var(--line);
  font-weight: 800;
  letter-spacing: -0.01em;
}
.bigbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 6px;
  border-radius: 24px;
  width: 100%;
  min-height: 64px;
  padding: 12px 14px;
  background: var(--yellow);
  box-shadow: 0 6px 0 var(--yellowDark);
  color: var(--ink);
  font-size: 18px;
  line-height: 1.08;
  text-transform: uppercase;
}
.bigbtn:active {
  transform: translateY(3px);
  box-shadow: 0 3px 0 var(--yellowDark);
}
.bigbtn.green {
  background: var(--green);
  box-shadow: 0 6px 0 var(--greenDark);
  color: #fff;
}
.bigbtn.light {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 6px 0 var(--blueDark);
  font-size: 15px;
  text-transform: none;
}
.mini-btn {
  background: #fff;
  color: var(--ink);
  border-radius: 16px;
  min-height: 44px;
  padding: 9px 12px;
  font-size: 13px;
  box-shadow: 0 4px 0 #d9e0ff;
  font-weight: 800;
}
.mini-btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #d9e0ff;
}
.start-panel .sub {
  margin-top: 16px;
  font-size: 11px;
}
.steps {
  display: grid;
  gap: 14px;
  margin: 15px 0;
}
.step {
  display: flex;
  gap: 11px;
  align-items: start;
  font-size: 13px;
  line-height: 1.48;
  color: #46405d;
  font-weight: 500;
}
.stepnum {
  flex: 0 0 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #7c67ec;
  color: #fff;
  font-weight: 800;
  border: 3px solid var(--line);
}
.help-detail,
.banner {
  background: #ffffff;
  border-radius: 18px;
  padding: 12px 14px;
  color: #374160;
  font-size: 12px;
  line-height: 1.5;
  font-weight: 600;
}
.guess-callout {
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: #fff6cf;
  color: #4a3a00;
  text-align: center;
  margin-top: 15px;
}
.guess-callout b {
  font-size: 14px;
}
.guess-callout span {
  font-size: 12px;
}
.footer {
  text-align: center;
  color: #e8f1ff;
  font-size: 11px;
  line-height: 1.5;
  margin: 18px 0 5px;
  font-weight: 600;
}
.turn-head {
  margin-top: 17px;
}
.tag {
  display: inline-flex;
  align-items: center;
  padding: 8px 12px;
  background: #fff;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  color: #22345f;
  box-shadow: 0 4px 0 #d4dcff;
}
.progress {
  margin: 12px 0;
  height: 14px;
  background: #e4ecff;
  border-radius: 99px;
  overflow: hidden;
  border: 3px solid var(--line);
}
.progress span {
  height: 100%;
  display: block;
  background: linear-gradient(90deg, #ffd84d, #4ce08a);
  border-radius: 99px;
  transition: width 0.3s ease;
}
.scoreboard {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 11px 0;
}
.score {
  border-radius: 18px;
  background: #fff;
  padding: 10px 4px;
  text-align: center;
  min-width: 0;
  box-shadow: 0 4px 0 #d9e0ff;
}
.score.current {
  background: #dce7ff;
  box-shadow: 0 4px 0 #8ab0ff;
}
.score strong {
  font-size: 24px;
  line-height: 1.1;
  display: block;
  color: var(--ink);
}
.score small {
  display: block;
  font-size: 10px;
  color: #536172;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 5px;
  font-weight: 600;
}
.player-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-inline-end: 3px;
}
.game-panel {
  padding-top: 17px;
}
.game-mascot {
  height: 168px;
  overflow: visible;
  margin-top: 12px;
  margin-bottom: 5px;
}
.game-panel > .panel-title {
  font-size: 21px;
  margin-top: 1px;
}
.actiontabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 15px 0;
}
.actiontab {
  background: #fff;
  color: var(--ink);
  border-radius: 16px;
  padding: 10px 6px;
  min-height: 52px;
  font-weight: 800;
  font-size: 13px;
  box-shadow: 0 4px 0 #d7ddff;
}
.actiontab.selected {
  background: #ffef95;
  box-shadow: 0 4px 0 #d2b84a;
}
.actionpane {
  display: none;
}
.actionpane.selected {
  display: block;
}
.section-heading {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 8px 0;
}
.questions {
  display: grid;
  gap: 10px;
  margin: 12px 0;
}
.qbtn {
  background: #fff;
  border-radius: 18px;
  min-height: 70px;
  padding: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: start;
  width: 100%;
  box-shadow: 0 4px 0 #d7ddff;
}
.qbtn:active {
  background: #edf6ff;
}
.qicon {
  display: grid;
  place-items: center;
  background: #ffef95;
  border-radius: 14px;
  width: 44px;
  height: 44px;
  font-size: 22px;
  flex-shrink: 0;
}
.qtext {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.38;
  flex: 1;
}
.qtext small {
  display: block;
  color: #55606f;
  margin-top: 4px;
  font-size: 10px;
  font-weight: 800;
}
.q-arrow {
  font-size: 28px;
  color: #4964ac;
}
.mathbox {
  background: #fff6dd;
  border-radius: 22px;
  padding: 16px;
  margin-top: 10px;
  box-shadow: 0 4px 0 #f0d17e;
}
.math-title {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  color: #6d502c;
  font-size: 13px;
  font-weight: 800;
}
.math-title b {
  font-size: 30px;
  color: #463053;
  line-height: 1.1;
  letter-spacing: 0.04em;
}
.mathform {
  display: flex;
  gap: 9px;
  margin-top: 18px;
}
.mathbtn {
  border: 4px solid var(--line);
  background: #fff;
  color: #493358;
  min-height: 60px;
  flex: 1;
  border-radius: 18px;
  font-size: 23px;
  font-weight: 800;
  box-shadow: 0 4px 0 #dfc27e;
}
.mathbtn:active {
  background: #ffecd0;
  transform: translateY(2px);
  box-shadow: 0 2px 0 #dfc27e;
}
.numbergrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  max-width: 350px;
  gap: 9px;
  margin: 14px auto;
}
.numbergrid.wide,
.numbergrid.expert {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  max-width: 100%;
  gap: 8px;
}
.numtile {
  aspect-ratio: 1.35;
  border-radius: 20px;
  background: #fff;
  color: var(--ink);
  font-size: 25px;
  font-weight: 800;
  box-shadow: 0 5px 0 #d9e0ff;
}
.numbergrid.expert .numtile,
.numbergrid.wide .numtile {
  font-size: 21px;
  aspect-ratio: 1.08;
  border-radius: 16px;
}
.numtile.possible {
  background: #7ce596;
  color: #14391f;
  box-shadow: 0 5px 0 #37b962;
}
.numtile.impossible {
  opacity: 0.36;
}
.numtile:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #d9e0ff;
}
.tinyhelper {
  font-size: 13px;
  color: #2c5a3e;
  line-height: 1.4;
  font-weight: 600;
}
.direct-guess {
  margin-top: 18px;
}
.result-card {
  margin: 14px 0;
  background: #eafbf4;
  border: 4px solid #72d69f;
  border-radius: 22px;
  padding: 16px;
  text-align: center;
  animation: popIn 0.3s ease;
  box-shadow: 0 5px 0 #bee9d1;
}
.result-card.bad {
  background: #fff0f3;
  border-color: #f0afc6;
  box-shadow: 0 5px 0 #f4c8d7;
}
.result-card.neutral {
  background: #eef3ff;
  border-color: #b9c6f7;
  box-shadow: 0 5px 0 #d6dfff;
}
.result-title {
  font-size: 27px;
  font-weight: 800;
  color: #30245a;
  line-height: 1.2;
  margin: 8px 0;
}
.result-desc {
  font-size: 14px;
  line-height: 1.55;
  color: #5a5074;
  margin: 8px 0;
  font-weight: 600;
}
.movement {
  border-radius: 16px;
  background: #fff;
  padding: 12px;
  margin: 13px 0 0;
  font-size: 13px;
  line-height: 1.5;
  font-weight: 600;
}
.movement .label {
  margin-bottom: 7px;
}
.movebig {
  color: #503dc1;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 0.03em;
  margin: 7px 0;
}
.answer-pill {
  color: #18835e;
}
.keep-turn {
  margin: 12px 0 15px;
}
.history-items {
  display: grid;
  gap: 8px;
  margin: 10px 0;
}
.history-items > div {
  border-radius: 14px;
  padding: 10px;
  background: #fff;
  color: #554d78;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 600;
  box-shadow: 0 4px 0 #d9e0ff;
}
.finalscore {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 0;
  border-bottom: 2px dashed #d4d9ee;
}
.finalscore .medal {
  font-size: 26px;
}
.finalscore > div:nth-child(2) {
  flex: 1;
  min-width: 0;
}
.finalscore small {
  display: block;
  color: #576273;
  font-size: 11px;
  margin-top: 3px;
  font-weight: 600;
}
.finalscore .value {
  font-size: 23px;
  color: #4b3aaf;
  white-space: nowrap;
}
.finalscore .value small {
  display: inline;
  font-size: 10px;
}
.settings-hero {
  padding: 5px 0;
}
.settings-hero h1 {
  font-size: 27px;
}
.settings-hero .small-mascot {
  height: 112px;
}
.small-mascot .detective-scene {
  transform: scale(0.72);
  transform-origin: center;
}
.lang-list {
  display: grid;
  gap: 10px;
  margin: 18px 0 4px;
}
.lang-choice {
  background: #fff;
  border-radius: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 62px;
  padding: 10px 13px;
  width: 100%;
  text-align: start;
  color: #32295b;
  font-size: 16px;
  box-shadow: 0 4px 0 #d9e0ff;
}
.lang-choice.is-selected {
  background: #ffef95;
  box-shadow: 0 4px 0 #d3b244;
}
.flag {
  font-size: 24px;
}
.lang-choice strong {
  flex: 1;
}
.checkmark {
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  color: #fff;
  font-size: 14px;
  font-weight: 800;
}
.is-selected .checkmark {
  background: #5d4bd6;
}
.detective-scene {
  position: relative;
  width: 170px;
  height: 150px;
  display: grid;
  place-items: center;
  isolation: isolate;
}
.detective-shadow {
  position: absolute;
  width: 100px;
  height: 14px;
  bottom: 4px;
  background: #1b2d5633;
  border-radius: 50%;
  filter: blur(4px);
}
.detective {
  position: absolute;
  left: 44px;
  top: 26px;
  width: 84px;
  height: 88px;
  background: linear-gradient(145deg, #ac9cff, #7366ee);
  border: 4px solid var(--line);
  border-radius: 46px;
  box-shadow:
    inset -8px -12px #5f53cb66,
    0 12px 18px #23304e30;
  animation: float 2.3s ease-in-out infinite;
}
.detective::before {
  content: '';
  position: absolute;
  left: 18px;
  top: 28px;
  width: 15px;
  height: 20px;
  background: #fff;
  border: 4px solid var(--line);
  border-radius: 50%;
}
.detective::after {
  content: '';
  position: absolute;
  right: 17px;
  top: 28px;
  width: 15px;
  height: 20px;
  background: #fff;
  border: 4px solid var(--line);
  border-radius: 50%;
}
.detector-pupil {
  position: absolute;
  top: 37px;
  width: 7px;
  height: 9px;
  background: #192349;
  border-radius: 50%;
  z-index: 2;
}
.detector-pupil.left {
  left: 31px;
}
.detector-pupil.right {
  right: 30px;
}
.detector-blush {
  position: absolute;
  top: 57px;
  width: 13px;
  height: 9px;
  background: #f8a0b2;
  border-radius: 50%;
  opacity: 0.9;
}
.detector-blush.left {
  left: 18px;
}
.detector-blush.right {
  right: 18px;
}
.detector-smile {
  position: absolute;
  width: 28px;
  height: 14px;
  border-bottom: 4px solid #283558;
  border-radius: 50%;
  top: 58px;
  left: 24px;
}
.detector-hat {
  position: absolute;
  left: 42px;
  top: 8px;
  width: 80px;
  height: 24px;
  background: #324986;
  border: 4px solid var(--line);
  border-radius: 18px 18px 12px 12px;
  transform: rotate(-7deg);
}
.detector-hat::before {
  content: '';
  position: absolute;
  left: 14px;
  top: -16px;
  width: 47px;
  height: 20px;
  background: #4b68b6;
  border: 4px solid var(--line);
  border-bottom: none;
  border-radius: 12px 12px 0 0;
}
.detector-brim {
  position: absolute;
  left: 33px;
  top: 26px;
  width: 94px;
  height: 13px;
  background: #23396c;
  border: 4px solid var(--line);
  border-radius: 16px;
  transform: rotate(-6deg);
}
.detector-body {
  position: absolute;
  left: 57px;
  top: 96px;
  width: 57px;
  height: 30px;
  background: #7f68f1;
  border: 4px solid var(--line);
  border-radius: 20px 20px 18px 18px;
}
.detector-hand {
  position: absolute;
  width: 16px;
  height: 16px;
  background: #8f7bf8;
  border: 4px solid var(--line);
  border-radius: 50%;
}
.detector-hand.left {
  left: 41px;
  top: 99px;
}
.detector-hand.right {
  left: 113px;
  top: 96px;
}
.detector-leg {
  position: absolute;
  width: 12px;
  height: 22px;
  background: #324986;
  border: 4px solid var(--line);
  border-radius: 12px;
  top: 120px;
}
.detector-leg.left {
  left: 67px;
}
.detector-leg.right {
  left: 92px;
}
.detector-foot {
  position: absolute;
  width: 22px;
  height: 11px;
  background: #1f2e57;
  border: 4px solid var(--line);
  border-radius: 13px;
  top: 135px;
}
.detector-foot.left {
  left: 56px;
}
.detector-foot.right {
  left: 88px;
}
.detector-magnifier {
  position: absolute;
  left: 4px;
  top: 52px;
  width: 54px;
  height: 54px;
  border: 6px solid #c8efff;
  border-radius: 50%;
  box-shadow: inset 0 0 0 4px #6db4d4;
  background: radial-gradient(circle at 35% 30%, #ffffffdd, #bde8ff 65%, #95cae7);
}
.detector-magnifier::before {
  content: '';
  position: absolute;
  right: -12px;
  bottom: -13px;
  width: 13px;
  height: 34px;
  background: #d09a51;
  border: 4px solid var(--line);
  border-radius: 12px;
  transform: rotate(-35deg);
}
.detector-orbit {
  position: absolute;
  color: #ffd84d;
  font-weight: 800;
  font-size: 22px;
  text-shadow:
    -2px 0 var(--line),
    0 2px var(--line),
    2px 0 var(--line),
    0 -2px var(--line);
}
.detector-orbit.one {
  top: 2px;
  left: 15px;
  transform: rotate(-13deg);
}
.detector-orbit.two {
  right: 8px;
  top: 6px;
  transform: rotate(13deg);
}
.detector-orbit.three {
  right: 11px;
  bottom: 14px;
  transform: rotate(20deg);
}
.detective-scene.dash-right .detective,
.detective-scene.dash-right .detector-body,
.detective-scene.dash-right .detector-hand,
.detective-scene.dash-right .detector-leg,
.detective-scene.dash-right .detector-foot,
.detective-scene.dash-right .detector-hat,
.detective-scene.dash-right .detector-brim,
.detective-scene.dash-right .detector-magnifier {
  animation: runRight 0.65s ease;
}
.detective-scene.dash-left .detective,
.detective-scene.dash-left .detector-body,
.detective-scene.dash-left .detector-hand,
.detective-scene.dash-left .detector-leg,
.detective-scene.dash-left .detector-foot,
.detective-scene.dash-left .detector-hat,
.detective-scene.dash-left .detector-brim,
.detective-scene.dash-left .detector-magnifier {
  animation: runLeft 0.65s ease;
}
.detective-scene.hop .detective,
.detective-scene.hop .detector-body,
.detective-scene.hop .detector-hand,
.detective-scene.hop .detector-leg,
.detective-scene.hop .detector-foot,
.detective-scene.hop .detector-hat,
.detective-scene.hop .detector-brim,
.detective-scene.hop .detector-magnifier {
  animation: hop 0.6s ease;
}
.detective-scene.caught .detective,
.detective-scene.caught .detector-body,
.detective-scene.caught .detector-hand,
.detective-scene.caught .detector-leg,
.detective-scene.caught .detector-foot,
.detective-scene.caught .detector-hat,
.detective-scene.caught .detector-brim,
.detective-scene.caught .detector-magnifier {
  animation: celebrate 0.75s ease;
}
.confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.confetti i {
  position: absolute;
  top: 50%;
  left: 50%;
  background: var(--c);
  width: 8px;
  height: 12px;
  border-radius: 2px;
  animation: burst 1s ease-out both;
  animation-delay: var(--delay);
  z-index: 2;
}
@keyframes float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
@keyframes runRight {
  0%,
  100% {
    transform: translateX(0);
  }
  50% {
    transform: translateX(19px);
  }
}
@keyframes runLeft {
  0%,
  100% {
    transform: translateX(0);
  }
  50% {
    transform: translateX(-19px);
  }
}
@keyframes hop {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-16px);
  }
}
@keyframes celebrate {
  0%,
  100% {
    transform: rotate(0);
  }
  30% {
    transform: rotate(-8deg) scale(1.08);
  }
  65% {
    transform: rotate(8deg) scale(1.08);
  }
}
@keyframes burst {
  to {
    opacity: 0;
    transform: translate(var(--x), var(--y)) rotate(var(--r));
  }
}
@keyframes popIn {
  from {
    opacity: 0.4;
    transform: scale(0.97);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@media (min-width: 500px) {
  .scoreboard {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---- 04-detective-captures.css ---- */
/*
 * Boutons de capture, carnet, détective animé et ses expressions, confettis, mouvements réduits.
 */
/* ===== V7 : captures, carnet, détective vivant, finitions ===== */
button {
  transition:
    transform 0.09s ease,
    box-shadow 0.09s ease,
    filter 0.15s,
    background-color 0.15s;
}
button:not(:disabled):active {
  transform: translateY(3px) scale(0.97);
}
#app.screen-enter > * {
  animation: screenIn 0.3s ease both;
}
@keyframes screenIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
/* chiffres bien lisibles */
.numtile {
  position: relative;
  color: #1a2150;
  font-weight: 800;
  letter-spacing: 0;
}
.numtile.possible {
  background: #8ff0a8;
  color: #0f3a1d;
}
.numtile.impossible {
  opacity: 0.32;
}
.numtile.sel {
  background: #ffd84d;
  color: #1d2450;
  box-shadow:
    0 5px 0 var(--yellowDark),
    0 0 0 4px #fff,
    0 0 0 7px #f36ab6;
  z-index: 2;
}
.numtile.in-net {
  outline: 3px dashed #6a52e6;
  outline-offset: 2px;
}
.numtile.hit-precise {
  animation: targetPulse 0.26s ease-in-out 3;
  z-index: 3;
}
.numtile.hit-precise::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 4px solid #f0386b;
  box-shadow: inset 0 0 0 4px #fff;
  animation: ringIn 0.5s ease-out both;
}
.numtile.hit-net::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 14px;
  border: 3px solid #4d37b8;
  background: repeating-linear-gradient(45deg, transparent 0 6px, #6a52e6aa 6px 8px),
    repeating-linear-gradient(-45deg, transparent 0 6px, #6a52e6aa 6px 8px);
  animation: netDrop 0.55s cubic-bezier(0.3, 1.4, 0.6, 1) both;
}
@keyframes targetPulse {
  50% {
    transform: scale(1.14);
  }
}
@keyframes ringIn {
  from {
    transform: scale(2.2);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes netDrop {
  from {
    transform: translateY(-60px) scale(1.3);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.pane-head .pick-hint {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  line-height: 1.3;
}
.capture-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}
.capbtn {
  border: 4px solid var(--line);
  border-radius: 20px;
  min-height: 62px;
  padding: 5px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  color: #fff;
  font-weight: 800;
  font-size: 16px;
  line-height: 1.15;
  text-shadow: 0 2px 0 #0003;
}
.capbtn small {
  font-size: 12px;
  font-weight: 600;
  opacity: 0.95;
}
.capbtn.precise {
  background: linear-gradient(180deg, #ff7fbf, #f0478f);
  box-shadow: 0 6px 0 #b42c6b;
}
.capbtn.net {
  background: linear-gradient(180deg, #9b86ff, #6a52e6);
  box-shadow: 0 6px 0 #4330a8;
}
.capbtn:disabled {
  filter: saturate(0.35);
  opacity: 0.55;
}
.capbtn:not(:disabled) {
  animation: capReady 0.5s ease;
}
@keyframes capReady {
  40% {
    transform: scale(1.05);
  }
}
/* scores animés */
.chip {
  position: relative;
}
.chip.bump {
  animation: bump 0.5s ease;
}
@keyframes bump {
  30% {
    transform: scale(1.12);
  }
}
.delta {
  position: absolute;
  top: -12px;
  inset-inline-end: -4px;
  font-style: normal;
  font-weight: 800;
  font-size: 15px;
  padding: 1px 8px;
  border-radius: 99px;
  border: 3px solid var(--line);
  animation: floatUp 0.9s ease both;
}
.delta.up {
  background: #4ce08a;
  color: #0f3a1d;
}
.delta.down {
  background: #ff8fa8;
  color: #5a0c22;
}
@keyframes floatUp {
  from {
    transform: translateY(10px) scale(0.6);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
/* carnet */
.nb-count {
  font-weight: 800;
  font-size: 17px;
  margin: 4px 0 8px;
}
.nb-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 5px;
  margin: 0 auto 8px;
  max-width: 330px;
}
.nb-grid.dense {
  grid-template-columns: repeat(10, 1fr);
}
.nb-grid span {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 800;
  border: 2px solid var(--line);
}
.nb-grid .ok {
  background: #8ff0a8;
  color: #0f3a1d;
}
.nb-grid .no {
  background: #e6e9f3;
  color: #9aa1bd;
  border-color: #c5cbe0;
  text-decoration: line-through;
}
.nb-legend {
  display: flex;
  justify-content: center;
  gap: 14px;
  font-size: 13px;
  font-weight: 600;
}
.nb-legend i {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  margin-inline-end: 4px;
  vertical-align: -1px;
  border: 2px solid var(--line);
}
.nb-legend i.ok {
  background: #8ff0a8;
}
.nb-legend i.no {
  background: #e6e9f3;
}
.nb-note {
  font-size: 13px;
  margin: 6px 0 4px;
}
.nb-h {
  font-size: 16px;
  margin: 10px 0 6px;
  text-align: start;
}
.history-items .hi {
  display: inline-block;
  width: 20px;
}
/* bulle du détective */
.bubble .quip {
  font-weight: 600;
  color: #3a4675;
  font-size: 13px;
}
/* ---- détective vivant ---- */
.dt-rig {
  position: absolute;
  inset: 0;
  transform-origin: 50% 92%;
}
.detective-scene .dt-rig > [class] {
  animation-name: none;
}
.detective-scene.idle .dt-rig {
  animation: bob 2.6s ease-in-out infinite;
}
@keyframes bob {
  50% {
    transform: translateY(-5px);
  }
}
.detector-pupil {
  animation: blink 4.5s infinite;
  transition:
    translate 0.25s,
    scale 0.25s;
}
@keyframes blink {
  0%,
  93%,
  100% {
    transform: scaleY(1);
  }
  96% {
    transform: scaleY(0.1);
  }
}
.detector-brow {
  position: absolute;
  top: 18px;
  width: 17px;
  height: 5px;
  background: var(--line);
  border-radius: 5px;
  opacity: 0;
  transition:
    opacity 0.2s,
    transform 0.25s;
  z-index: 3;
}
.detector-brow.left {
  left: 17px;
}
.detector-brow.right {
  right: 16px;
}
.detector-mouth,
.detector-tongue {
  position: absolute;
  opacity: 0;
  transition: opacity 0.2s;
}
.detector-smile {
  transition:
    width 0.2s,
    left 0.2s,
    height 0.2s,
    opacity 0.2s;
}
/* expressions */
.expr-curious .detector-brow {
  opacity: 1;
}
.expr-curious .detector-brow.left {
  transform: translateY(-5px) rotate(-14deg);
}
.expr-curious .detector-pupil {
  translate: 3px 0;
}
.expr-curious .detector-smile {
  width: 18px;
  left: 29px;
  height: 10px;
}
.expr-surprised .detector-brow {
  opacity: 1;
  transform: translateY(-6px);
}
.expr-surprised .detector-pupil {
  scale: 0.75;
}
.expr-surprised .detector-smile {
  opacity: 0;
}
.expr-surprised .detector-mouth {
  opacity: 1;
  width: 13px;
  height: 15px;
  left: 31px;
  top: 58px;
  border: 4px solid var(--line);
  border-radius: 50%;
  background: #6b2c55;
}
.expr-worried .detector-brow {
  opacity: 1;
}
.expr-worried .detector-brow.left {
  transform: rotate(16deg);
}
.expr-worried .detector-brow.right {
  transform: rotate(-16deg);
}
.expr-worried .detector-pupil {
  translate: 0 3px;
}
.expr-worried .detector-smile {
  opacity: 0;
}
.expr-worried .detector-mouth,
.expr-grimace .detector-mouth {
  opacity: 1;
  width: 26px;
  height: 12px;
  left: 25px;
  top: 64px;
  border-top: 4px solid var(--line);
  border-radius: 50%;
}
.expr-grimace .detector-brow {
  opacity: 1;
}
.expr-grimace .detector-brow.left {
  transform: rotate(18deg) translateY(2px);
}
.expr-grimace .detector-brow.right {
  transform: rotate(-18deg) translateY(2px);
}
.expr-grimace .detector-pupil {
  scale: 1 0.35;
}
.expr-grimace .detector-smile {
  opacity: 0;
}
.expr-grimace .detector-tongue {
  opacity: 1;
  width: 11px;
  height: 10px;
  left: 33px;
  top: 65px;
  background: #ff7b9c;
  border: 3px solid var(--line);
  border-top: none;
  border-radius: 0 0 8px 8px;
}
.expr-proud .detector-brow {
  opacity: 1;
  transform: translateY(-4px);
}
.expr-proud .detector-pupil {
  scale: 1 0.45;
}
.expr-proud .detector-smile {
  width: 34px;
  left: 21px;
  height: 17px;
}
/* animations par situation (transformations uniquement : fluide sur petits téléphones) */
.think-dots {
  position: absolute;
  right: 6px;
  top: 30px;
  display: none;
  gap: 4px;
}
.think-dots i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--line);
  animation: dot 1.2s ease-in-out infinite;
}
.think-dots i:nth-child(2) {
  animation-delay: 0.15s;
}
.think-dots i:nth-child(3) {
  animation-delay: 0.3s;
}
.detective-scene.think .think-dots {
  display: flex;
}
.detective-scene.think .detector-orbit {
  display: none;
}
@keyframes dot {
  50% {
    transform: translateY(-6px);
  }
}
.detective-scene.think .dt-rig {
  animation: ponder 2.4s ease-in-out infinite;
}
@keyframes ponder {
  0%,
  100% {
    transform: rotate(0);
  }
  50% {
    transform: rotate(-6deg);
  }
}
.detective-scene.search .dt-rig > .detector-magnifier {
  animation: sweep 1.8s ease-in-out infinite;
}
@keyframes sweep {
  0%,
  100% {
    transform: translate(0, 0) rotate(0);
  }
  35% {
    transform: translate(10px, -14px) rotate(-12deg) scale(1.12);
  }
  70% {
    transform: translate(-4px, 6px) rotate(8deg);
  }
}
.detective-scene.search .dt-rig {
  animation: lean 1.8s ease-in-out infinite;
}
@keyframes lean {
  50% {
    transform: translateX(-4px) rotate(-3deg);
  }
}
.detective-scene.aim .dt-rig {
  animation: aim 0.5s ease-in-out infinite alternate;
}
@keyframes aim {
  to {
    transform: scale(1.05) translateY(-2px);
  }
}
.detective-scene.dash-right .dt-rig {
  animation: walkR 0.9s ease both;
}
.detective-scene.dash-left .dt-rig {
  animation: walkL 0.9s ease both;
}
@keyframes walkR {
  25% {
    transform: translate(8px, -8px);
  }
  50% {
    transform: translate(16px, 0);
  }
  75% {
    transform: translate(22px, -6px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@keyframes walkL {
  25% {
    transform: translate(-8px, -8px);
  }
  50% {
    transform: translate(-16px, 0);
  }
  75% {
    transform: translate(-22px, -6px);
  }
  100% {
    transform: translate(0, 0);
  }
}
.detective-scene.dash-right .dt-rig > .detector-foot.left,
.detective-scene.dash-left .dt-rig > .detector-foot.left {
  animation: step 0.3s ease-in-out 3;
}
.detective-scene.dash-right .dt-rig > .detector-foot.right,
.detective-scene.dash-left .dt-rig > .detector-foot.right {
  animation: step 0.3s ease-in-out 0.15s 3;
}
@keyframes step {
  50% {
    transform: translateY(-6px);
  }
}
.detective-scene.hop .dt-rig {
  animation: hop2 0.7s ease 2;
}
@keyframes hop2 {
  40% {
    transform: translateY(-18px) scaleY(1.04);
  }
  70% {
    transform: translateY(0) scaleY(0.95);
  }
}
.detective-scene.caught .dt-rig {
  animation: dance 0.55s ease-in-out 4;
}
@keyframes dance {
  0%,
  100% {
    transform: rotate(0) translateY(0);
  }
  25% {
    transform: rotate(-10deg) translateY(-10px);
  }
  50% {
    transform: rotate(0) translateY(0);
  }
  75% {
    transform: rotate(10deg) translateY(-10px);
  }
}
.detective-scene.caught .dt-rig > .detector-hand.left,
.detective-scene.proud .dt-rig > .detector-hand.left {
  animation: waveL 0.55s ease-in-out 4;
}
.detective-scene.caught .dt-rig > .detector-hand.right,
.detective-scene.proud .dt-rig > .detector-hand.right {
  animation: waveR 0.55s ease-in-out 4;
}
@keyframes waveL {
  50% {
    transform: translate(-6px, -22px);
  }
}
@keyframes waveR {
  50% {
    transform: translate(6px, -22px);
  }
}
.detective-scene.proud .dt-rig {
  animation: proud 0.6s ease 2;
}
@keyframes proud {
  50% {
    transform: translateY(-12px) scale(1.04);
  }
}
.detective-scene.grimace .dt-rig {
  animation: shake 0.5s ease 1;
}
@keyframes shake {
  20%,
  60% {
    transform: translateX(-6px) rotate(-3deg);
  }
  40%,
  80% {
    transform: translateX(6px) rotate(3deg);
  }
}
/* victoire : pluie de confettis */
.rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 40;
}
.rain i {
  position: absolute;
  top: -20px;
  width: var(--w);
  height: calc(var(--w) * 1.6);
  background: var(--c);
  border-radius: 2px;
  animation: fall var(--t) linear var(--d) 2 both;
}
@keyframes fall {
  from {
    transform: translateY(-20px) rotate(0);
  }
  to {
    transform: translateY(110vh) rotate(540deg);
  }
}
/* animations réduites */
body.reduce-motion *,
body.reduce-motion *::before,
body.reduce-motion *::after {
  animation: none !important;
  transition: none !important;
}
@media (max-width: 350px) {
  .numbergrid.expert {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .numbergrid.expert .numtile {
    aspect-ratio: 1.12;
  }
  .capbtn {
    font-size: 14px;
    min-height: 56px;
  }
  .pane-head .pick-hint {
    font-size: 12px;
  }
}
@media (max-height: 640px) {
  .capbtn {
    min-height: 52px;
  }
}

/* loupe qui vient grossir le numéro choisi */
.loupe-fx {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 150%;
  aspect-ratio: 1;
  margin: -75% 0 0 -75%;
  border-radius: 50%;
  border: 6px solid #c8efff;
  box-shadow:
    0 0 0 3px var(--line),
    inset 0 0 0 3px #6db4d4;
  background: radial-gradient(circle at 35% 30%, #ffffffcc, #bde8ff55 60%, #95cae733);
  pointer-events: none;
  z-index: 4;
  animation: loupeIn 0.7s cubic-bezier(0.2, 1.3, 0.5, 1) both;
}
.loupe-fx::after {
  content: '';
  position: absolute;
  right: -16%;
  bottom: -24%;
  width: 18%;
  height: 42%;
  background: #d09a51;
  border: 3px solid var(--line);
  border-radius: 10px;
  transform: rotate(-40deg);
}
.numtile.hit-precise {
  font-size: 1.25em;
}
@keyframes loupeIn {
  0% {
    transform: translate(60px, 70px) rotate(25deg) scale(0.5);
    opacity: 0;
  }
  60% {
    transform: translate(-3px, -3px) rotate(-6deg) scale(1.05);
    opacity: 1;
  }
  100% {
    transform: none;
    opacity: 1;
  }
}
/* grosse loupe sur le numéro attrapé */
.found-lens {
  position: relative;
  width: 96px;
  height: 96px;
  margin: 2px auto 0;
  animation: lensPop 0.6s cubic-bezier(0.2, 1.4, 0.5, 1) both;
}
.lens-glass {
  position: absolute;
  left: 0;
  top: 0;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 7px solid #c8efff;
  box-shadow:
    0 0 0 4px var(--line),
    inset 0 0 0 4px #6db4d4;
  background: radial-gradient(circle at 35% 30%, #fff, #d9f3ff 65%, #a9dcf5);
}
.lens-glass b {
  font-size: 40px;
  font-weight: 800;
  color: var(--ink);
  animation: lensZoom 1s ease 0.2s both;
}
.lens-handle {
  position: absolute;
  right: 6px;
  bottom: 2px;
  width: 14px;
  height: 38px;
  background: #d09a51;
  border: 4px solid var(--line);
  border-radius: 10px;
  transform: rotate(-42deg);
}
@keyframes lensPop {
  from {
    transform: scale(0.2) rotate(-30deg);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes lensZoom {
  0% {
    transform: scale(0.6);
  }
  60% {
    transform: scale(1.35);
  }
  100% {
    transform: scale(1.15);
  }
}

  55% {

}
.rp-dots {

}

}

}

/* V7.9 : film plus lent (5 s par étape) avec animation en 2 temps */
.rp-stage {
  height: 136px;
}
.rp-from {
  position: absolute;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 38px;
  font-weight: 800;
  color: var(--ink);
  background: #fff;
  border: 6px solid #c8efff;
  box-shadow: 0 0 0 4px var(--line);
  opacity: 0;
}
.rp-from.go-right {
  animation: fromRight 1.9s ease both;
}
.rp-from.go-left {
  animation: fromLeft 1.9s ease both;
}
.rp-from.go-up {
  animation: fromUp 1.9s ease both;
}
@keyframes fromRight {
  0% {
    opacity: 1;
    transform: none;
  }
  45% {
    opacity: 1;
    transform: scale(1.08);
  }
  60% {
    opacity: 1;
    transform: translateX(-6px);
  }
  100% {
    opacity: 0;
    transform: translateX(140px) translateY(-30px) scale(0.5);
  }
}
@keyframes fromLeft {
  0% {
    opacity: 1;
    transform: none;
  }
  45% {
    opacity: 1;
    transform: scale(1.08);
  }
  60% {
    opacity: 1;
    transform: translateX(6px);
  }
  100% {
    opacity: 0;
    transform: translateX(-140px) translateY(-30px) scale(0.5);
  }
}
@keyframes fromUp {
  0% {
    opacity: 1;
    transform: none;
  }
  45% {
    opacity: 1;
    transform: scale(1.08) rotate(-6deg);
  }
  100% {
    opacity: 0;
    transform: translateY(-110px) rotate(40deg) scale(0.4);
  }
}
.rp-num.delayed {
  animation-delay: 1.5s;
}
.rp-num.rp-right.delayed,
.rp-num.rp-left.delayed,
.rp-num.rp-hop.delayed {
  animation-duration: 1.1s;
}
.rp-num.rp-right,
.rp-num.rp-left,
.rp-num.rp-hop {
  opacity: 0;
}
@keyframes rpRight {
  0% {
    transform: translateX(-120px) translateY(-40px) scale(0.6);
    opacity: 0;
  }
  55% {
    transform: translateX(10px) translateY(-18px) scale(1.1);
    opacity: 1;
  }
  75% {
    transform: translateY(4px) scaleY(0.92);
  }
  100% {
    transform: none;
    opacity: 1;
  }
}
@keyframes rpLeft {
  0% {
    transform: translateX(120px) translateY(-40px) scale(0.6);
    opacity: 0;
  }
  55% {
    transform: translateX(-10px) translateY(-18px) scale(1.1);
    opacity: 1;
  }
  75% {
    transform: translateY(4px) scaleY(0.92);
  }
  100% {
    transform: none;
    opacity: 1;
  }
}
@keyframes rpHop {
  0% {
    transform: translateY(-110px) rotate(-40deg) scale(0.4);
    opacity: 0;
  }
  60% {
    transform: translateY(8px) rotate(6deg);
    opacity: 1;
  }
  100% {
    transform: none;
    opacity: 1;
  }
}
.rp-trail {
  position: absolute;
  bottom: 10px;
  font-size: 20px;
  opacity: 0;
  animation: trail 1.6s ease 0.9s both;
}
.rp-trail.left {
  transform: scaleX(-1);
}
@keyframes trail {
  0% {
    opacity: 0;
    left: 30%;
  }
  40% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    left: 65%;
  }
}
.rp-trail.left {
  animation-name: trailL;
}
@keyframes trailL {
  0% {
    opacity: 0;
    left: 65%;
  }
  40% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    left: 30%;
  }
}
.rp-num.rp-in {
  animation-duration: 1s;
}
.rp-num.rp-win.delayed {
  animation-delay: 0.2s;
}
.rp-stage:not(.still) .rp-num::after {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 3px solid #ffffffaa;
  animation: halo 2s ease-out 2.6s infinite;
  opacity: 0;
}
.rp-num {
  position: relative;
}
@keyframes halo {
  0% {
    opacity: 0.9;
    transform: scale(0.85);
  }
  100% {
    opacity: 0;
    transform: scale(1.35);
  }
}
.rp-bar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 6px;
  width: 100%;
  background: #ffd84d;
  transform-origin: left;
  animation-name: rpBar;
  animation-timing-function: linear;
  animation-fill-mode: both;
}
[dir='rtl'] .rp-bar {
  transform-origin: right;
}
@keyframes rpBar {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
/* V8.0 : film sans flash, choix du joueur, mode automatique / boutons */

/* V8.4 : saut « à l'aveugle » (type de déplacement, jamais la position) */
.blind-jump {
  position: relative;
  flex: 0 0 auto;
  width: 82px;
  height: 44px;
}
.bj-track {
  position: absolute;
  left: 4px;
  right: 4px;
  bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.bj-track i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #b9c6ee;
}
.bj-token {
  position: absolute;
  left: 50%;
  bottom: 10px;
  width: 26px;
  height: 26px;
  margin-left: -13px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--purple);
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 2px 0 var(--purpleDark);
}
.blind-jump.hop .bj-token {
  animation: bj-hop 1.1s cubic-bezier(0.3, 0.7, 0.4, 1) 0.2s both;
}
.blind-jump.grow .bj-token {
  animation: bj-grow 1s ease-out 0.2s both;
}
.blind-jump.shrink .bj-token {
  animation: bj-shrink 1s ease-out 0.2s both;
}
.blind-jump.mirror::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 2px;
  bottom: 2px;
  border-left: 2px dashed #8f7ff0;
}
.blind-jump.mirror .bj-token {
  animation: bj-mirror 1.2s ease-in-out 0.2s both;
}
.move-line .bj-label {
  font-size: 22px;
  font-weight: 800;
  color: #503dc1;
  white-space: nowrap;
}
@keyframes bj-hop {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(calc(var(--dx) / 2), -16px);
  }
  100% {
    transform: translate(var(--dx), 0);
  }
}
@keyframes bj-grow {
  0% {
    transform: scale(1);
  }
  60% {
    transform: scale(1.7);
  }
  100% {
    transform: scale(1.45);
  }
}
@keyframes bj-shrink {
  0% {
    transform: scale(1);
  }
  100% {
    transform: scale(0.65);
  }
}
@keyframes bj-mirror {
  0% {
    transform: translateX(-22px) scaleX(1);
  }
  50% {
    transform: translateX(0) scaleX(0);
  }
  100% {
    transform: translateX(22px) scaleX(1);
  }
}
.reduce-motion .bj-token {
  animation: none !important;
}
@media (prefers-reduced-motion: reduce) {
  .bj-token {
    animation: none !important;
  }
}

.tut-grid {
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  gap: 4px;
  margin: 10px 0 6px;
}
.tut-cell {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 18px;
  font-weight: 800;
  padding: 0;
}
button.tut-cell {
  cursor: pointer;
}
.tut-cell.out {
  background: #eef0f6;
  color: #a3abc4;
  text-decoration: line-through;
  border-color: #c9cfdf;
}
.tut-cell.secret {
  background: #ffef95;
  box-shadow: 0 0 0 3px #f2b705 inset;
}
.tut-cell.in-net {
  background: #d9f5e5;
}
.tut-cell.sel {
  background: var(--purple);
  color: #fff;
}
.tut-cell.arrived {
  animation: tut-arrive 0.9s ease-out 0.6s both;
}
@keyframes tut-arrive {
  0% {
    transform: translateX(-100%) scale(0.8);
    opacity: 0.4;
  }
  100% {
    transform: none;
    opacity: 1;
  }
}
.tut-legend {
  font-size: 12px;
  color: var(--ink2);
}
.tut-dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  margin: 0 4px;
  border-radius: 4px;
  vertical-align: -1px;
}
.tut-dot.secret {
  background: #ffef95;
  box-shadow: 0 0 0 2px #f2b705 inset;
}
.tut-dot.out {
  background: #eef0f6;
  border: 1px solid #c9cfdf;
}
.tut-q {
  width: 100%;
  margin: 6px 0;
}
.reduce-motion .tut-cell.arrived {
  animation: none;
}

/* V8.4.1 : tutoriel — boucle 9 → 1, carnet qui se décale, fenêtre du premier lancement */
.tut-cell.shifted {
  animation: tut-shift 0.8s ease-out 0.5s both;
}
@keyframes tut-shift {
  0% {
    transform: translateX(-60%);
    background: #e4ecff;
  }
  100% {
    transform: none;
  }
}
.tut-loop {
  position: relative;
  padding-bottom: 26px;
}
.tut-loop .loop-arrow {
  position: absolute;
  left: 5%;
  right: 5%;
  bottom: 0;
  width: 90%;
  height: 30px;
  overflow: visible;
}
.tut-loop .loop-arrow path {
  fill: none;
  stroke: var(--purple);
  stroke-width: 3;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  opacity: 0;
  animation: tut-loop-draw 0.8s ease-out 1.4s forwards;
}
@keyframes tut-loop-draw {
  to {
    opacity: 1;
  }
}
.tut-cell.loop-a {
  animation: tut-loop-a 2.8s ease-in-out both;
}
.tut-cell.loop-b {
  animation: tut-loop-b 2.8s ease-in-out both;
}
@keyframes tut-loop-a {
  0%,
  35% {
    background: #ffef95;
    box-shadow: 0 0 0 3px #f2b705 inset;
  }
  45%,
  100% {
    background: #fff;
    box-shadow: none;
  }
}
@keyframes tut-loop-b {
  0%,
  35% {
    background: #fff;
  }
  45%,
  60% {
    background: #ffef95;
    box-shadow: 0 0 0 3px #f2b705 inset;
  }
  100% {
    background: #fff;
    box-shadow: none;
  }
}
.tut-cell.wrong {
  background: #ffd9e3;
  border-color: #e0567f;
}

  font-weight: 700;
  text-align: center;
}
.ch-old {

.reduce-motion .tut-cell.shifted,
.reduce-motion .tut-cell.loop-a,
.reduce-motion .tut-cell.loop-b,
.reduce-motion .tut-loop .loop-arrow path {

<body><main id="app" aria-live="polite"></main>
<script>
(() => {
'use strict';
/* ---- 00-constants.js ---- */
/*
 * Constantes du jeu : règles chiffrées, stockage, couleurs.
 *
 * Organisation du code (les fichiers src/js/*.js sont concaténés dans cet ordre,
 * dans UNE seule portée privée, par tools/build.mjs) :
 *   00 constantes et règles      08 déplacements du numéro + journal de la chasse
 *   01 traductions (générées)    09 actions du joueur (question, calcul, capture, tour suivant)
 *   02 état `g`, utilitaires,    10 détective animé, confettis
 *      sons, sauvegarde          11 écrans (accueil, bureau, réglages, jeu, résultat, fins)
 *   03 questions (indices)       12 film du parcours du numéro
 *   04 calculs                   13 fenêtres (pause, carnet, noms, défi…)
 *   05 défi solo, start()        14 tutoriel scripté
 *   06 carrière solo (score, XP) 15 render() + bind() : affichage et événements
 *   07 chronos                   16 bouton Retour Android, démarrage, API de test
 *
 * Principe : tout l'état vit dans l'objet `g` (sauvegardé dans localStorage).
 * Chaque action modifie `g` puis appelle render(), qui reconstruit l'écran.
 */

/** Racine de l'interface : render() y écrit tout le HTML. */
const app = document.getElementById('app');

/** Clés localStorage : partie en cours (V6+), ancienne partie V5 (reprise), records. */
const STORAGE = 'numeroEnFuiteV6',
  OLD_STORAGE = 'numeroEnFuiteV5',
  RECORDS_STORAGE = 'numeroEnFuiteRecords';

/** Couleur de chaque joueur (1 à 4). */
const colors = ['#8c75ef', '#31be95', '#f2af5c', '#ef7ca8'];

/**
 * Niveaux : numéros de 1 à `max` ; le filet couvre `netSize` numéros voisins.
 * (Petit 5–7 ans, Moyen 8–10 ans, Grand 11 ans et +, Génie : déplacements ±3/±5/×2/miroir.)
 */
const LEVELS = {
  junior: { max: 9, netSize: 2 },
  malin: { max: 15, netSize: 3 },
  expert: { max: 30, netSize: 3 },
  genius: { max: 50, netSize: 3 }
};
/** Le défi solo se joue toujours de 1 à 100. */
const CHALLENGE_MAX = 100;
/** Plus grand numéro possible pour un mode ('normal' | 'challenge') et un niveau. */
const maxFor = (mode, level) => (mode === 'challenge' ? CHALLENGE_MAX : (LEVELS[level] || LEVELS.expert).max);

/**
 * Points (mode « Points » ; en mode « Course » la première capture gagne la partie).
 *   precise         numéro exact attrapé
 *   net             numéro attrapé avec le filet
 *   miss            par numéro raté (1 en tir précis, 2 ou 3 avec le filet)
 *   deductionBonus  capture juste après avoir posé une question
 */
const SCORE = { precise: 10, net: 4, miss: -1, deductionBonus: 1 };

/** Nombre de filets par joueur et par partie (tous les modes). */
const NETS_MAX = 3;

/**
 * Score du défi solo. Règle de conception : prolonger la partie ne doit JAMAIS rapporter.
 * Un tour de plus coûte au moins perTurn + miss = 65 points, alors qu'un calcul juste rapporte
 * au plus goodMath + timeRefund × perSecond = 10 + 30 = 40 points. Le combo est seulement visuel.
 */
const CHALLENGE_SCORE = {
  start: 1000,
  perTurn: 45, // par tour après le premier
  question: 5,
  wrongMath: 10,
  goodMath: 10,
  miss: 20, // capture précise ratée
  netMiss: 40,
  netWin: 50, // victoire au filet (moins méritoire qu'une capture précise)
  perSecond: 2, // par seconde restante, contre la montre
  timeRefundMs: 15000 // calcul juste en contre la montre
};
/** Difficultés du défi → niveau utilisé pour les calculs, les questions et le filet (numéros toujours 1–100). */
const CHALLENGE_DIFFS = { easy: 'junior', medium: 'malin', hard: 'expert' };

/** Version affichée dans les Réglages : versionName de app/build.gradle, injecté par tools/build.mjs. */
const APP_VERSION = "8.9";

/* ---- 01-i18n.js ---- */
/*
 * Traductions français / anglais / arabe.
 * Source : src/i18n/{fr,en,ar}.json (une clé par ligne, facile à relire et à traduire).
 * tools/build.mjs les injecte ici et refuse de construire si une langue n'a pas
 * exactement les mêmes clés que fr.json.
 * Dans les textes, {nom} est remplacé (et échappé) par t('clé', { nom: valeur }).
 */
const dictionaries = {
 "fr": {
  "almost": "PRESQUE !",
  "alreadyChanged": "Questions déjà changées",
  "answerTimeUp": "⏱ Temps de réponse écoulé : plus d’aide ce tour. Choisis ton numéro !",
  "appVersion": "Version {v}",
  "askQuit": "Quitter la partie",
  "back": "Retour",
  "bonusClue": "Ton indice bonus",
  "bonusDeduction": "🧠 +1 bonus déduction (question posée) !",
  "bravo": "BRAVO !",
  "cancel": "Annuler",
  "captGoPrecise": "Attraper le {n}",
  "captNet": "Filet magique",
  "captNumbers": "{k} numéros",
  "captPick": "Touche un numéro (1 à {max}), puis choisis ta capture.",
  "captPrecise": "Capture précise",
  "captured": "{count} attrapé(s)",
  "capturesSummary": "{count} numéro(s) attrapé(s) en {turns} tours.",
