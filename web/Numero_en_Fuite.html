/* ---- 14-tutorial.js ---- */
/*
 * Tutoriel : une mini-enquête ENTIÈREMENT scriptée, avec un numéro visible.
 * Elle montre en une minute ce qu'une vraie partie cache : la question raye des numéros,
 * puis le numéro s'enfuit et tout le carnet se décale avec lui, le parcours tourne en boucle
 * (après 9 on revient à 1), puis on choisit sa capture.
 * Elle n'utilise pas le moteur du jeu (aucun risque de toucher à une partie en cours) :
 * son seul état est g.tut = { step, sel, miss, loopOk, win }.
 */

/** Scénario : niveau Petit (1–9), le numéro est sur le 4, la question « plus grand que 5 ? », puis +1. */
const TUT = { max: 9, start: 4, threshold: 5, shift: 1, netSize: 2 };
/** Étapes, dans l'ordre. */
const TUT_STEPS = ['intro', 'ask', 'answer', 'move', 'loop', 'capture', 'done'];
const tutStep = () => TUT_STEPS[g.tut.step];
const tutAfter = name => g.tut.step >= TUT_STEPS.indexOf(name);
const tutSecret = () => (tutAfter('move') ? TUT.start + TUT.shift : TUT.start);
/** Numéros encore possibles dans le carnet à l'étape en cours. */
function tutPossible() {
  if (!tutAfter('answer')) return all(TUT.max);
  const kept = all(TUT.max).filter(n => n <= TUT.threshold);
  return tutAfter('move') ? kept.map(n => n + TUT.shift) : kept;
}
/** Numéros couverts par le filet du tutoriel (même règle que netRange au niveau Petit). */
const tutNet = n => {
  const first = Math.min(Math.max(1, n), TUT.max - TUT.netSize + 1);
  return Array.from({ length: TUT.netSize }, (_, i) => first + i);
};

function openTutorial() {
  g.tut = { step: 0, sel: null, miss: null, loopOk: false };
  g.tutSeen = true;
  g.modal = 'tutorial';
  sfx('tap');
  render();
}
function tutNext() {
  if (tutStep() === 'loop' && !g.tut.loopOk) return;
  g.tut.step = Math.min(TUT_STEPS.length - 1, g.tut.step + 1);
  g.tut.sel = null;
  g.tut.miss = null;
  sfx('tap');
  render();
}
/** Étape « boucle » : le joueur touche la case où arrive un numéro parti du 9 avec +1. */
function tutLoopPick(n) {
  if (tutStep() !== 'loop') return;
  g.tut.sel = n;
  g.tut.loopOk = n === 1;
  sfx(g.tut.loopOk ? 'win' : 'bad');
  render();
}
/** Capture du tutoriel : réussie → dernière étape ; ratée → explication et nouvel essai. */
function tutCapture(mode) {
  const n = g.tut.sel;
  if (tutStep() !== 'capture' || n == null) return;
  const nums = mode === 'net' ? tutNet(n) : [n];
  if (nums.includes(tutSecret())) {
    g.tut.win = mode;
    g.tut.step = TUT_STEPS.indexOf('done');
    sfx('win');
  } else {
    g.tut.miss = { mode, nums };
    g.tut.sel = null;
    sfx('bad');
  }
  render();
}

/** Grille 1–9 du carnet du tutoriel ; `clickable` rend les cases cliquables (data-tutpick). */
function tutGrid(cellClass, clickable) {
  return `<div class="tut-grid" dir="ltr">${all(TUT.max)
    .map(n =>
      clickable
        ? `<button class="tut-cell ${cellClass(n)}" data-tutpick="${n}">${n}</button>`
        : `<span class="tut-cell ${cellClass(n)}">${n}</span>`
    )
    .join('')}</div>`;
}

/** HTML de la fenêtre du tutoriel. */
function tutorialView() {
  const { sel, miss } = g.tut,
    step = tutStep(),
    possible = tutPossible(),
    secret = tutSecret(),
    net = step === 'capture' && sel != null ? tutNet(sel) : [];
  const grid = tutGrid(
    n =>
      [
        possible.includes(n) ? '' : 'out',
        n === secret ? 'secret' : '',
        n === sel ? 'sel' : net.includes(n) ? 'in-net' : '',
        step === 'move' && n === secret ? 'arrived' : '',
        step === 'move' && possible.includes(n) ? 'shifted' : ''
      ].join(' '),
    step === 'capture'
  );
  const legend = `<p class="tut-legend"><span class="tut-dot secret"></span>${t('tutLegendSecret')} <span class="tut-dot out"></span>${t('tutLegendOut')}</p>`;
  const next = () => `<button class="bigbtn" id="tutNext">${t('tutNext')} ▶</button>`;
  let body = '',
    actions = next();
  if (step === 'intro') body = `<p>${t('tut0', { n: TUT.start, max: TUT.max })}</p>${grid}${legend}`;
  else if (step === 'ask') {
    body = `<p>${t('tut1')}</p>${grid}`;
    actions = `<button class="qbtn tut-q" id="tutAsk"><span class="qicon">📏</span><span class="qtext">${t('qGreater', { k: TUT.threshold })}</span></button>`;
  } else if (step === 'answer')
    body = `<div class="result-title">${t('noAnswer')}</div><p>${t('tut2', { k: TUT.threshold })}</p>${grid}${legend}`;
  else if (step === 'move')
    body = `<div class="move-line">${blindJump(TUT.shift)}<span>${t('tut3', { from: TUT.start, to: secret })}</span></div>${grid}`;
  else if (step === 'loop') {
    // Démonstration à part : un numéro sur 8 fait +1 (→ 9), puis encore +1 : après 9, on revient à 1.
    const loopGrid = tutGrid(
      n =>
        [
          n === 8 ? 'loop-a' : '',
          n === 9 ? 'loop-b' : '',
          n === sel ? (g.tut.loopOk ? 'sel' : 'wrong') : ''
        ].join(' '),
      true
    );
    body = `<p>${t('tutLoop')}</p><div class="tut-loop ${sel != null ? 'answered' : ''}">${loopGrid}<svg class="loop-arrow" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path d="M95 2 C95 22 5 22 5 2" /></svg></div><p class="tut-loop-msg">${sel == null ? t('tutLoopAsk') : g.tut.loopOk ? t('tutLoopOk') : t('tutLoopNo')}</p>`;
    actions = g.tut.loopOk ? next() : ''; // « Suivant » n'apparaît qu'après la bonne case
  } else if (step === 'capture') {
    body = `<p>${miss ? t(miss.mode === 'net' ? 'tutMissNet' : 'tutMiss', { nums: miss.nums.join('·'), n: secret }) : t('tut4')}</p>${grid}`;
    actions = `<div class="capture-row"><button class="capbtn precise" id="tutPrecise" ${sel == null ? 'disabled' : ''}><span>🎯 ${t('captPrecise')}</span><small><bdi dir="ltr">+${SCORE.precise}</bdi></small></button><button class="capbtn net" id="tutNet" ${sel == null ? 'disabled' : ''}><span>🕸️ ${sel != null ? `<bdi dir="ltr">${net.join('·')}</bdi>` : t('captNet')}</span><small><bdi dir="ltr">+${SCORE.net}</bdi></small></button></div>`;
  } else {
    body = `<div class="hero-mascot small-mascot">${mascot('caught')}</div><div class="result-title">🎉 ${t('bravo')}</div><p>${t(g.tut.win === 'net' ? 'tutWinNet' : 'tutWin', { n: secret })}</p><div class="help-detail">${t('tut5')}</div>`;
    actions = `<button class="bigbtn green" id="tutPlay">▶ ${t('play')}</button><button class="bigbtn light" id="tutRestart">🔁 ${t('tutRestart')}</button>`;
  }
  return `<div class="tut-head"><h2>🎓 ${t('tutTitle')}</h2><span class="rp-step">${t('rpStep', { i: g.tut.step + 1, n: TUT_STEPS.length })}</span><button class="tut-close" id="tutClose" aria-label="${t('close')}">✕</button></div><div class="tut-body">${body}</div>${actions}`;
}

/** Fenêtre proposée au tout premier lancement : le tutoriel est conseillé, jamais imposé. */
function tutInviteView() {
  return `<div class="hero-mascot small-mascot">${mascot('think')}</div><h2>👋 ${t('tutInviteTitle')}</h2><p>${t('tutInviteText')}</p><button class="bigbtn green" id="inviteTutorial">🎓 ${t('tutTry')}</button><button class="bigbtn light" id="closeModal">${t('tutLater')}</button>`;
}

/* ---- 15-render.js ---- */
/*
 * Affichage : render() reconstruit tout l'écran à partir de `g`, puis bind() branche
 * les événements. Simple et sûr pour un petit jeu : il n'y a jamais d'écran « désynchronisé ».
 */

let lastScreen = null,
  enterTimer = null,
  lastModalKey = null;
/** Redessine l'écran courant + la fenêtre ouverte, puis sauvegarde. */
function render() {
  if (g.screen === 'home') restoreFromChallenge();
  const changed = g.screen !== lastScreen;
  if (changed) {
    lastScreen = g.screen;
    setTimeout(() => window.scrollTo(0, 0), 0);
  }
  if (g.screen === 'game' && g.phase === 'choose' && g.helpUsed && g.tab !== 'guess') g.tab = 'guess';
  document.documentElement.lang = g.lang;
  document.documentElement.dir = g.lang === 'ar' ? 'rtl' : 'ltr';
  {
    const bc = 'scr-' + g.screen + (g.reduceMotion ? ' reduce-motion' : '');
    if (document.body.className !== bc) document.body.className = bc;
  }
  document.title = t('title');
  const screens = { home, game, settings, end, office };
  app.innerHTML = (screens[g.screen] || end)() + modalView();
  {
    const mk = g.screen + '|' + (g.modal || ''),
      mb = app.querySelector('.modal-back');
    if (mb && mk === lastModalKey) mb.classList.add('steady');
    lastModalKey = mk;
  }
  rpSchedule();
  if (changed && !g.reduceMotion) {
    app.classList.remove('screen-enter');
    void app.offsetWidth;
    app.classList.add('screen-enter');
    clearTimeout(enterTimer);
    enterTimer = setTimeout(() => app.classList.remove('screen-enter'), 380);
  } else if (!changed) app.classList.remove('screen-enter');
  bind();
  save();
}
/** Branche les clics des éléments de l'écran (identifiants et attributs data-*). */
function bind() {
  const click = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', fn);
  };
  app.querySelectorAll('[data-players]').forEach(b =>
    b.addEventListener('click', () => {
      g.players = Number(b.dataset.players);
      render();
    })
  );
  app.querySelectorAll('[data-level]').forEach(b =>
    b.addEventListener('click', () => {
      g.level = b.dataset.level;
      render();
    })
  );
  app.querySelectorAll('[data-language]').forEach(b =>
    b.addEventListener('click', () => {
      g.lang = b.dataset.language;
      render();
    })
  );
  app.querySelectorAll('[data-tab]').forEach(b =>
    b.addEventListener('click', () => {
      if (g.helpUsed && b.dataset.tab !== 'guess') return;
      g.tab = b.dataset.tab;
      if (g.tab === 'math' && !g.mathStarted) {
        g.mathStarted = true;
        g.mathElapsed = 0;
        lastTick = Date.now();
      }
      render();
    })
  );
  app
    .querySelectorAll('[data-question]')
    .forEach(b => b.addEventListener('click', () => ask(b.dataset.question)));
  app.querySelectorAll('[data-guess]').forEach(b =>
    b.addEventListener('click', () => {
      if (g.capturing || g.phase !== 'choose') return;
      g.sel = Number(b.dataset.guess);
      sfx('select');
      render();
    })
  );
  click('capPrecise', () => launchCapture('precise'));
  click('capNet', () => launchCapture('net'));
  click('motionToggle', () => {
    g.reduceMotion = !g.reduceMotion;
    render();
  });
  click('replayToggle', () => {
    g.replayAsk = g.replayAsk === false;
    render();
  });
  click('rpYes', () => {
    sfx('tap');
    openReplay();
  });
  click('openReplay', () => {
    sfx('tap');
    openReplay();
  });
  click('rpNo', () => {
    g.modal = null;
    render();
  });
  click('rpNever', () => {
    g.replayAsk = false;
    g.modal = null;
    render();
  });
  click('rpModeAuto', () => {
    g.rpAuto = true;
    const n = rpFrames().length;
    if ((g.rpIdx || 0) >= n - 1) g.rpIdx = 0;
    g.rpPlaying = true;
    render();
  });
  click('rpModeManual', () => {
    g.rpAuto = false;
    g.rpPlaying = false;
    render();
  });
  click('rpClose', () => {
    g.rpPlaying = false;
    g.modal = null;
    render();
  });
  click('rpRestart', () => {
    g.rpIdx = 0;
    g.rpPlaying = g.rpAuto !== false;
    render();
  });
  click('rpPrev', () => {
    g.rpPlaying = false;
    g.rpIdx = Math.max(0, (g.rpIdx || 0) - 1);
    render();
  });
  click('rpNext', () => {
    g.rpPlaying = false;
    g.rpIdx = Math.min(rpFrames().length - 1, (g.rpIdx || 0) + 1);
    render();
  });
  click('rpPlay', () => {
    const n = rpFrames().length;
    if (!g.rpPlaying && (g.rpIdx || 0) >= n - 1) g.rpIdx = 0;
    g.rpPlaying = !g.rpPlaying;
    render();
  });
  app
    .querySelectorAll('[data-math]')
    .forEach(b => b.addEventListener('click', () => mathAnswer(Number(b.dataset.math))));
  click('start', () => {
    sfx('tap');
    g.modal = 'names';
    render();
  });
  app.querySelectorAll('[data-name]').forEach(el =>
    el.addEventListener('input', () => {
      g.names[+el.dataset.name] = el.value.slice(0, 12);
    })
  );
  app.querySelectorAll('[data-phelp]').forEach(b =>
    b.addEventListener('click', () => {
      const i = +b.dataset.phelp;
      g.playerHelp[i] = !g.playerHelp[i];
      b.classList.toggle('on', g.playerHelp[i]);
      b.setAttribute('aria-checked', g.playerHelp[i]);
      sfx('tap');
      save();
    })
  );
  app.querySelectorAll('[data-gmode]').forEach(b =>
    b.addEventListener('click', () => {
      g.gameMode = b.dataset.gmode;
      app.querySelectorAll('[data-gmode]').forEach(x => {
        x.classList.toggle('on', x === b);
        x.setAttribute('aria-checked', x === b);
      });
      sfx('tap');
      save();
    })
  );
  click('namesGo', () => {
    for (let i = 0; i < g.players; i++) {
      const el = document.getElementById('name' + i);
      if (el) g.names[i] = el.value.replace(/\s+/g, ' ').trim().slice(0, 12);
    }
    if (g.players === 1) g.starter = 0;
    g.modal = null;
    sfx('tap');
    const ae = document.activeElement;
    if (ae && ae.blur) ae.blur();
    if (g.namesStarting) return;
    g.namesStarting = true;
    setTimeout(() => {
      g.namesStarting = false;
      start(true);
    }, 120);
  });
  click('again', () => {
    sfx('tap');
    if (g.mode === 'challenge') return startChallenge(g.chKind, g.chDiff);
    if (g.players > 1) g.starter = ((g.starter || 0) + 1) % g.players;
    start();
  });
  click('quitYes', () => {
    g.modal = null;
    g.inGame = false;
    g.screen = 'home';
    render();
  });
  click('quitNo', () => {
    g.modal = 'pause';
    render();
  });
  click('askQuit', () => {
    g.modal = 'quit';
    render();
  });
  click('handoffGo', () => {
    sfx('tap');
    g.modal = null;
    lastTick = Date.now();
    render();
  });
  app.querySelectorAll('[data-timer]').forEach(b =>
    b.addEventListener('click', () => {
      g.timerMode = b.dataset.timer;
      render();
    })
  );
  click('soundToggle', () => {
    g.sound = !g.sound;
    render();
    sfx('tap');
  });
  click('openOffice', () => {
    g.officeFrom = g.screen === 'end' ? 'end' : 'home';
    g.screen = 'office';
    g.modal = null;
    sfx('tap');
    render();
  });
  click('closeOffice', () => {
    g.screen = g.officeFrom === 'end' && g.soloResult ? 'end' : 'home';
    sfx('tap');
    render();
  });
  click('officePlay', () => {
    // solo, au dernier niveau joué : on passe par la fenêtre « Prêt ? » habituelle
    g.players = 1;
    g.mode = 'normal';
    g.screen = 'home';
    g.modal = 'names';
    sfx('tap');
    render();
  });
  click('menu', () => {
    g.screen = 'home';
    g.last = null;
    g.modal = null;
    render();
  });
  click('pause', () => {
    sfx('tap');
    g.modal = 'pause';
    render();
  });
  click('resumeGame', () => {
    sfx('tap');
    g.modal = null;
    lastTick = Date.now();
    render();
  });
  click('pauseSettings', () => {
    g.settingsFrom = 'game';
    g.screen = 'settings';
    render();
  });
  click('openNotebook', () => {
    g.modal = 'notebook';
    render();
  });
  click('openRules', () => {
    g.modal = 'rules';
    render();
  });
  click('openChallenge', () => {
    g.modal = 'challenge';
    render();
  });
  app.querySelectorAll('[data-chdiff]').forEach(b =>
    b.addEventListener('click', () => {
      g.chDiffPref = b.dataset.chdiff;
      sfx('tap');
      render();
    })
  );
  click('openTutorial', openTutorial);
  click('rulesTutorial', openTutorial);
  click('inviteTutorial', openTutorial);
  click('tutRestart', openTutorial);
  click('tutNext', tutNext);
  click('tutAsk', tutNext);
  click('tutPrecise', () => tutCapture('precise'));
  click('tutNet', () => tutCapture('net'));
  click('tutClose', () => {
    g.modal = null;
    g.tut = null;
    render();
  });
  click('tutPlay', () => {
    g.tut = null;
    g.modal = 'names';
    render();
  });
  app.querySelectorAll('[data-tutpick]').forEach(b =>
    b.addEventListener('click', () => {
      if (g.tut.step === TUT_STEPS.indexOf('loop')) return tutLoopPick(Number(b.dataset.tutpick));
      g.tut.sel = Number(b.dataset.tutpick);
      g.tut.miss = null;
      sfx('tap');
      render();
    })
  );
  click('chTimed', () => startChallenge('timed'));
  click('chEndless', () => startChallenge('endless'));
  app.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => pressKey(b.dataset.key)));
  click('closeModal', () => {
    g.modal = null;
    lastTick = Date.now();
    render();
  });
  click('openSettings', () => {
    g.settingsFrom = g.screen;
    g.screen = 'settings';
    render();
  });
  const close = () => {
    g.screen = ['home', 'game', 'end'].includes(g.settingsFrom) ? g.settingsFrom : 'home';
    render();
  };
  click('closeSettings', close);
  click('next', nextTurn);
  click('history', () => {
    g.showHistory = !g.showHistory;
    render();
  });
  click('hints', () => {
    g.showHints = !g.showHints;
    render();
  });
  app.querySelectorAll('[data-info]').forEach(b =>
    b.addEventListener('click', () => {
      g.showInfo = !g.showInfo;
      sfx('tap');
      render();
    })
  );
  click('reroll', () => {
    if (g.rerolled || g.helpUsed || g.phase !== 'choose') return;
    makeChoices();
    g.rerolled = true;
    render();
  });
}

/* ---- 16-boot.js ---- */
/*
 * Démarrage et points d'entrée externes.
 */

function back() {
  if (['rules', 'names', 'challenge', 'tutorial', 'tutInvite'].includes(g.modal) && g.screen === 'home') {
    g.modal = null;
    g.tut = null;
    render();
    return true;
  }
  if (g.screen === 'game' && g.modal === 'quit') {
    g.modal = 'pause';
    render();
    return true;
  }
  if (g.screen === 'game' && ['replay', 'replayAsk'].includes(g.modal)) {
    g.rpPlaying = false;
    g.modal = null;
    render();
    return true;
  }
  if (g.screen === 'game' && ['pause', 'notebook'].includes(g.modal)) {
    g.modal = null;
    lastTick = Date.now();
    render();
    return true;
  }
  if (g.screen === 'game' && g.modal === 'handoff') return true;
  if (g.screen === 'office') {
    g.screen = g.officeFrom === 'end' && g.soloResult ? 'end' : 'home';
    render();
    return true;
  }
  if (g.screen === 'settings') {
    g.screen = ['home', 'game', 'end'].includes(g.settingsFrom) ? g.settingsFrom : 'home';
    render();
    return true;
  }
  if (g.screen === 'game') {
    g.modal = 'pause';
    render();
    return true;
  }
  if (g.screen === 'end') {
    g.screen = 'home';
    render();
    return true;
  }
  return false;
}
load();
// Tout premier lancement : on PROPOSE le tutoriel (une seule fois, jamais imposé).
if (!g.tutSeen && g.screen === 'home' && !g.modal) {
  g.tutSeen = true;
  g.modal = 'tutInvite';
}
if (g.screen === 'game' && g.phase === 'choose' && (!g.math || !g.choices.length)) prepareTurn();
render();
/**
 * API publique du jeu :
 *   - back() est appelée par l'application Android (bouton Retour, MainActivity.java) ;
 *   - le reste sert aux tests automatiques (tests/game.test.cjs) pour lire l'état et jouer des coups.
 * Ne pas renommer sans mettre à jour ces deux fichiers.
 */
window.__numero = {
  get state() {
    return g;
  },
  start,
  ask,
  guess,
  mathAnswer,
  nextTurn,
  maxN,
  qbyid,
  wrap,
  dictionaries,
  render,
  back,
  netsLeft,
  openReplay,
  rpFrames,
  RP_STEP,
  mathTimeout,
  mathLeft,
  tick,
  turnTimeout,
  turnLeft,
  limitOf,
  answerLeft,
  answerTimeout,
  startChallenge,
  openTutorial,
  tutCapture,
  tutLoopPick,
  scoreSolo,
  settleSolo,
  rankOf,
  loadCareer,
  finishChallenge,
  chScore,
  pressKey,
  moveFn,
  nextMove,
  records,
  netCapture,
  netRange,
  netSize,
  launchCapture,
  helpMode
};
window.__numeroV5 = window.__numero;

})();
</script>
