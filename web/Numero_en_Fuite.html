/* ---- 02-state.js ---- */
/*
 * État du jeu et fonctions de base.
 *   - petits utilitaires (hasard, mélange, échappement HTML) ;
 *   - `g` : TOUT l'état (écran, joueurs, scores, numéro secret, chronos…), sauvegardé à chaque render() ;
 *   - t() : traduction ; pname() : nom d'un joueur ; sons Web Audio ; sauvegarde / reprise.
 */

/** Entier aléatoire de 0 à n − 1. */
const rnd = n => Math.floor(Math.random() * n);
/** Élément au hasard d'un tableau. */
const pick = xs => xs[rnd(xs.length)];
/** Copie mélangée (Fisher–Yates). */
const shuffle = xs => {
  const a = [...xs];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
/** Ramène n dans 1…max en faisant le tour (max + 1 → 1, 0 → max). */
const wrap = (n, max) => ((n - 1 + max * 500) % max) + 1;
/** [1, 2, …, max] */
const all = max => Array.from({ length: max }, (_, i) => i + 1);
/** Échappe le texte avant de l'insérer dans du HTML (noms des joueurs, etc.). */
const esc = x =>
  String(x).replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
  );
/** État d'une partie neuve. Les réglages sont recopiés par start(). */
const initial = () => ({
  screen: 'home',
  settingsFrom: 'home',
  lang: 'fr',
  players: 2,
  level: 'junior',
  turn: 0,
  limit: 16,
  secret: 1,
  candidates: all(9),
  scores: [0, 0],
  stars: [0, 0],
  captures: 0,
  phase: 'choose',
  helpUsed: false,
  last: null,
  history: [],
  showHistory: false,
  showHints: false,
  shownIds: [],
  choices: [],
  math: null,
  rerolled: false,
  tab: 'question',
  sound: true,
  inGame: false,
  modal: null,
  timerMode: 'normal',
  mathElapsed: 0,
  mathStarted: false,
  turnElapsed: 0,
  sel: null,
  capturing: null,
  helpMode: null,
  reduceMotion: false,
  names: ['', '', '', ''],
  gameMode: 'race',
  chDiffPref: 'medium',
  placed: [], // Course : podium [{ player, round, turn }]
  starter: 0,
  playerHelp: [false, false, false, false],
  mode: 'normal',
  chKind: null,
  chElapsed: 0,
  answerElapsed: 0,
  typed: ''
});
/** L'état courant. Remplacé (pas modifié) par start() et load() : toujours lire `g`, jamais une copie. */
let g = initial();
/** Texte traduit dans la langue courante (repli sur le français, puis sur la clé). */
const t = (key, vars = {}) => {
  const value = dictionaries[g.lang]?.[key] || dictionaries.fr[key] || key;
  return value.replace(/\{(\w+)\}/g, (_, k) => esc(vars[k] ?? ''));
};
/** Plus grand numéro de la partie en cours. */
const maxN = () => maxFor(g.mode, g.level);
/** Indice du joueur dont c'est le tour (le premier joueur change à chaque partie : g.starter). */
const active = () => (g.turn + (g.starter || 0)) % g.players;
/** Mode « Course » (et solo) : la première capture gagne. Sinon mode « Points » (score après N tours). */
const isRace = () => g.mode !== 'challenge' && (g.players === 1 || g.gameMode !== 'score');
/** Filets restants pour le joueur i (NETS_MAX par partie). */
const netsLeft = (i = active()) =>
  Array.isArray(g.netsLeft) && g.netsLeft[i] != null ? g.netsLeft[i] : NETS_MAX;
const netAvailable = () => netsLeft() > 0;
/** Nom affiché du joueur i (« Toi » en solo). */
const pname = i => (g.players === 1 ? t('you') : (g.names && g.names[i]) || t('player', { n: i + 1 }));
/** Symbole court d'un déplacement : nombre (±1, ±2) ou objet { op: '+' | '×' | '÷' | 'mirror', k }. */
const shiftSymbol = s =>
  typeof s === 'object' && s
    ? s.op === '+'
      ? s.k < 0
        ? '⬅ ' + s.k
        : '➡ +' + s.k
      : s.op === '×'
        ? '✖️ ×' + s.k
        : s.op === '÷'
          ? '➗ ÷' + s.k
          : '🪞'
    : s < 0
      ? '⬅ ' + s
      : s > 0
        ? '➡ +' + s
        : '⏸ 0';
/** Explication d'un déplacement spécial (double, moitié, miroir), vide pour un simple décalage. */
const moveHint = s =>
  typeof s === 'object' && s
    ? s.op === '×'
      ? t('mvDouble', { max: maxN() })
      : s.op === '÷'
        ? t('mvHalf')
        : s.op === 'mirror'
          ? t('mvMirror', { max: maxN(), max1: maxN() - 1, ex: maxN() + 1 - 10 })
          : ''
    : '';
/** Flèche dans le sens de lecture (RTL en arabe). */
const arrow = () => (g.lang === 'ar' ? '←' : '→');
/** Sauvegarde `g` (appelée à chaque render()). Les erreurs (stockage plein ou interdit) sont ignorées. */
function save() {
  try {
    localStorage.setItem(STORAGE, JSON.stringify(g));
  } catch (e) {}
}
/* Sons générés localement (Web Audio) : aucun fichier, aucun réseau. */
let audio = null;
/** Joue un petit son synthétisé ('tap', 'win', 'bad', 'tick'…), si le son est activé. */
function sfx(kind) {
  if (!g.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const seq =
      {
        tap: [[660, 0.05]],
        good: [
          [523, 0.09],
          [659, 0.09],
          [784, 0.16]
        ],
        bad: [
          [330, 0.12],
          [247, 0.2]
        ],
        move: [
          [440, 0.06],
          [554, 0.08]
        ],
        select: [[740, 0.04]],
        aim: [
          [880, 0.05],
          [1175, 0.08]
        ],
        net: [
          [392, 0.06],
          [523, 0.06],
          [659, 0.06],
          [784, 0.12]
        ],
        win: [
          [523, 0.1],
          [659, 0.1],
          [784, 0.1],
          [1047, 0.28]
        ]
      }[kind] || [];
    let at = audio.currentTime;
    for (const [f, d] of seq) {
      const o = audio.createOscillator(),
        v = audio.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      v.gain.setValueAtTime(0.0001, at);
      v.gain.exponentialRampToValueAtTime(0.18, at + 0.015);
      v.gain.exponentialRampToValueAtTime(0.0001, at + d);
      o.connect(v).connect(audio.destination);
      o.start(at);
      o.stop(at + d + 0.02);
      at += d * 0.9;
    }
  } catch (e) {}
}
/**
 * Reprend la partie sauvegardée. Toute valeur absente, ancienne ou incohérente est
 * corrigée ou ignorée : une sauvegarde abîmée ne doit jamais bloquer le jeu.
 */
function load() {
  try {
    let raw = localStorage.getItem(STORAGE);
    const legacy = !raw;
    if (legacy) raw = localStorage.getItem(OLD_STORAGE);
    const d = JSON.parse(raw);
    if (
      !d ||
      !['home', 'game', 'end', 'settings', 'office'].includes(d.screen) ||
      ![1, 2, 3, 4].includes(d.players) ||
      !(d.level in LEVELS) ||
      !['fr', 'en', 'ar'].includes(d.lang) ||
      !Array.isArray(d.scores) ||
      d.scores.length !== d.players ||
      !Array.isArray(d.candidates) ||
      !Array.isArray(d.choices) ||
      !Array.isArray(d.stars) ||
      d.stars.length !== d.players ||
      !Array.isArray(d.history)
    )
      return;
    if (!['choose', 'result'].includes(d.phase) || (d.phase === 'result' && !d.last)) d.phase = 'choose';
    const max = maxFor(d.mode, d.level);
    if (!(d.secret >= 1 && d.secret <= max) || !d.candidates.includes(d.secret))
      (d.candidates = all(max)), (d.secret = Math.min(Math.max(1, d.secret | 0), max));
    const base = initial();
    g = Object.assign(base, d);
    if (legacy && d.screen === 'game') g.inGame = true;
    if (['replay', 'replayAsk'].includes(g.modal)) g.modal = null;
    if (!['quit', 'handoff', 'pause', 'notebook', 'rules', 'names', 'challenge', null].includes(g.modal))
      g.modal = null;
    if (g.hunt && !Array.isArray(g.hunt.steps)) g.hunt = null;
    g.tut = null; // le tutoriel n'est jamais repris
    if (!Array.isArray(g.placed)) g.placed = [];
    if (!['normal', 'challenge'].includes(g.mode)) g.mode = 'normal';
    if (g.mode === 'challenge' && !['timed', 'endless'].includes(g.chKind)) g.chKind = 'endless';
    if (!(g.chDiff in CHALLENGE_DIFFS)) g.chDiff = 'hard'; // parties de défi sauvegardées avant la V8.4
    if (!(g.chDiffPref in CHALLENGE_DIFFS)) g.chDiffPref = 'medium';
    g.chElapsed = Number(g.chElapsed) || 0;
    g.answerElapsed = Number(g.answerElapsed) || 0;
    g.typed = typeof g.typed === 'string' ? g.typed : '';
    if (g.screen === 'game' && !g.modal && g.phase === 'choose') g.modal = 'pause';
    g.turnElapsed = Number(g.turnElapsed) || 0;
    g.capturing = null;
    if (!(g.sel >= 1 && g.sel <= max)) g.sel = null;
    g.reduceMotion = !!g.reduceMotion;
    if (!['race', 'score'].includes(g.gameMode)) g.gameMode = 'race';
    if (!Array.isArray(g.netsLeft) || g.netsLeft.length !== g.players)
      g.netsLeft = Array(g.players).fill(NETS_MAX);
    g.starter = Number.isInteger(g.starter) ? g.starter : 0;
    g.playerHelp = Array.from({ length: 4 }, (_, i) => !!(Array.isArray(g.playerHelp) && g.playerHelp[i]));
    g.names = Array.from({ length: 4 }, (_, i) =>
      Array.isArray(g.names) && typeof g.names[i] === 'string' ? g.names[i].slice(0, 12) : ''
    );
    if (g.screen === 'home' && !['rules', 'names', 'challenge'].includes(g.modal)) g.modal = null;
    if (!['normal', 'long', 'off'].includes(g.timerMode)) g.timerMode = 'normal';
    g.mathElapsed = Number(g.mathElapsed) || 0;
  } catch (e) {}
}

/* ---- 03-questions.js ---- */
/*
 * Questions-indices (« Est-il plus grand que 7 ? »…).
 * Chaque tour propose 3 questions de types différents, toutes UTILES : chacune
 * sépare les numéros encore possibles en deux groupes non vides.
 */

/** Toutes les questions possibles pour le niveau : { id, type, icon, text, test(n) }. */
function qpool() {
  const max = maxN(),
    pool = [];
  const add = (id, type, icon, key, values, test) =>
    pool.push({ id, type: t(type), icon, text: t(key, values), test });
  for (let k = 2; k < max; k++) {
    add(`above${k}`, 'typeCompare', '📏', 'qGreater', { k }, n => n > k);
    add(`below${k}`, 'typeCompare', '🔎', 'qLess', { k }, n => n < k);
  }
  add('even', 'typeTrick', '🟣', 'qEven', {}, n => n % 2 === 0);
  add('odd', 'typeTrick', '🟡', 'qOdd', {}, n => n % 2 !== 0);
  for (let k = 1; k <= 3; k++)
    for (let v = 4; v <= max + 3; v += 2)
      add(`plus${k}_${v}`, 'typeMath', '➕', 'qPlus', { k, v }, n => n + k > v);
  for (let k = 4; k <= max * 2 - 2; k += 2)
    add(`double_${k}`, 'typeMath', '✖️', 'qDouble', { k }, n => 2 * n > k);
  for (let a = 2; a < max - 1; a += 2) {
    const b = Math.min(a + 3, max);
    add(`range_${a}`, 'typeRange', '🎯', 'qBetween', { a, b }, n => n >= a && n <= b);
  }
  if (g.level !== 'junior') {
    add('mult3', 'typeTrick', '🧩', 'qMult3', {}, n => n % 3 === 0);
    for (let k = 1; k <= 3; k++)
      for (let v = 2; v <= max - 2; v += 2)
        add(`minus${k}_${v}`, 'typeMath', '➖', 'qMinus', { k, v }, n => n - k >= v);
  }
  if (['expert', 'genius'].includes(g.level)) {
    for (const k of [4, 5, 6]) add(`mult${k}`, 'typeDiv', '🧠', 'qMultiple', { k }, n => n % k === 0);
    for (const k of [4, 6, 8, 10])
      add(
        `digitsum${k}`,
        'typeDigits',
        '🔢',
        'qDigitSum',
        { k },
        n =>
          String(n)
            .split('')
            .reduce((a, b) => a + Number(b), 0) > k
      );
    for (const k of [10, 15, 20, 25])
      add(`near${k}`, 'typeDistance', '📍', 'qNear', { k }, n => Math.abs(n - k) < 4);
  }
  return pool;
}
/** Question à partir de son identifiant (stable, sauvegardé dans l'historique). */
function qbyid(id) {
  return qpool().find(q => q.id === id);
}
/** Choisit les 3 questions du tour dans g.choices (en évitant celles déjà montrées). */
function makeChoices() {
  const pool = qpool();
  let unused = pool.filter(q => !g.shownIds.includes(q.id));
  if (unused.length < 3) {
    g.shownIds = [];
    unused = pool;
  }
  const qualifies = q => g.candidates.some(n => q.test(n)) && g.candidates.some(n => !q.test(n));
  let candidates = shuffle(unused.filter(qualifies));
  if (candidates.length < 3)
    candidates = candidates.concat(
      shuffle(
        pool.filter(q => qualifies(q) && !g.choices.includes(q.id) && !candidates.some(c => c.id === q.id))
      )
    );
  if (candidates.length < 3)
    candidates = candidates.concat(shuffle(unused.filter(q => !candidates.some(c => c.id === q.id))));
  const chosen = [];
  const types = new Set();
  for (const q of candidates) {
    if (!types.has(q.type)) {
      chosen.push(q);
      types.add(q.type);
    }
    if (chosen.length >= 3) break;
  }
  for (const q of candidates) {
    if (chosen.length >= 3) break;
    if (!chosen.some(c => c.id === q.id)) chosen.push(q);
  }
  g.choices = chosen.slice(0, 3).map(q => q.id);
  g.shownIds.push(...g.choices);
}

/* ---- 04-math.js ---- */
/*
 * Calculs adaptés à l'âge (bonne réponse = étoile + indice gratuit) et préparation d'un tour.
 *   Petit : + et − jusqu'à 10 · Moyen : retenues et tables · Grand / Génie : priorités opératoires.
 * Les mauvaises réponses proposées sont des erreurs plausibles (±1, ±10, chiffres inversés,
 * calcul fait de gauche à droite sans les priorités…).
 */

function mathText(m) {
  return m.text || `${m.a} ${m.op} ${m.b}`;
}
/** Crée le calcul du tour dans g.math : { text, result, options, threshold }. */
function makeMath() {
  let text, result;
  const r = (a, b) => a + rnd(b - a + 1);
  if (g.level === 'junior') {
    // 5–7 ans : + et − jusqu'à 10
    if (rnd(3) < 2) {
      const a = r(1, 9),
        b = r(1, 10 - a);
      text = `${a} + ${b}`;
      result = a + b;
    } else {
      const a = r(4, 10),
        b = r(1, a - 1);
      text = `${a} − ${b}`;
      result = a - b;
    }
  } else if (g.level === 'malin') {
    // 8–10 ans : retenues, tables de multiplication
    const m = rnd(3);
    if (m === 0) {
      const ua = r(2, 9),
        ub = r(10 - ua, 9);
      const a = 10 * r(1, 5) + ua,
        b = 10 * r(1, 3) + ub;
      text = `${a} + ${b}`;
      result = a + b;
    } else if (m === 1) {
      const ta = r(3, 9),
        ua = r(0, 7),
        tb = r(1, ta - 1),
        ub = r(ua + 1, 9);
      const a = 10 * ta + ua,
        b = 10 * tb + ub;
      text = `${a} − ${b}`;
      result = a - b;
    } else {
      const a = r(3, 9),
        b = r(3, 9);
      text = `${a} × ${b}`;
      result = a * b;
    }
  } else {
    // 11 ans et + : opérations mélangées (priorités), 6 propositions
    let lr = null;
    for (let tries = 0; tries < 50; tries++) {
      const m = rnd(5);
      if (m === 0) {
        const a = r(4, 9),
          b = r(3, 9),
          d = r(2, 6),
          q = r(2, 9);
        if (a * b - q < 0) continue;
        text = `${a} × ${b} − ${d * q} ÷ ${d}`;
        result = a * b - q;
        const v = (a * b - d * q) / d;
        lr = Number.isInteger(v) ? v : null;
      } else if (m === 1) {
        const b = r(2, 9),
          q = r(3, 12),
          c = r(2, 9);
        const d = r(3, Math.min(25, q * c));
        text = `${b * q} ÷ ${b} × ${c} − ${d}`;
        result = q * c - d;
        const v = (b * q) / (b * c) - d;
        lr = Number.isInteger(v) ? v : null;
      } else if (m === 2) {
        const a = r(5, 12),
          b = r(3, 9),
          c = r(3, 9),
          d = r(2, 6);
        if (a * b <= c * d) continue;
        text = `${a} × ${b} − ${c} × ${d}`;
        result = a * b - c * d;
        lr = (a * b - c) * d;
      } else if (m === 3) {
        const b = r(3, 9),
          c = r(3, 9),
          a = r(b * c + 2, 99),
          d = r(2, 9);
        text = `${a} − ${b} × ${c} + ${d}`;
        result = a - b * c + d;
        lr = (a - b) * c + d;
      } else {
        const a = r(2, 9),
          b = r(2, 9),
          c = r(3, 9),
          d = r(2, 15);
        text = `(${a} + ${b}) × ${c} − ${d}`;
        result = (a + b) * c - d;
        lr = a + b * c - d;
      }
      if (result >= 0) break;
    }
    g._lr = lr;
  }
  const deltas =
    g.level === 'junior'
      ? [1, -1, 2, -2, 3, -3]
      : ['expert', 'genius'].includes(g.level)
        ? [1, -1, 2, -2, 10, -10, 3, -3, 5, -5, 4, -4, 20, -20]
        : [1, -1, 2, -2, 10, -10, 3, -3];
  const nWrong = ['expert', 'genius'].includes(g.level) ? 5 : 2;
  const cands = shuffle(deltas).map(d => result + d);
  const sw = Number(String(result).split('').reverse().join(''));
  if (result >= 12 && sw !== result) cands.unshift(sw);
  if (['expert', 'genius'].includes(g.level) && g._lr != null && g._lr >= 0 && g._lr !== result)
    cands.unshift(g._lr);
  delete g._lr;
  const wrong = [];
  for (const c of cands) {
    if (c >= 0 && c !== result && !wrong.includes(c)) wrong.push(c);
    if (wrong.length === nWrong) break;
  }
  const threshold = pick([
    ...new Set([
      Math.floor(maxN() / 2),
      Math.floor(maxN() / 3),
      Math.ceil((maxN() * 2) / 3),
      Math.ceil((maxN() * 3) / 4)
    ])
  ]);
  g.math = { text, result, options: shuffle([result, ...wrong]), threshold };
}
/** Remet à zéro tout ce qui est propre à un tour (aide, chronos, sélection) et tire questions + calcul. */
function prepareTurn() {
  g.helpKind = null;
  g.answerElapsed = 0;
  g.answerLost = false;
  g.typed = '';
  g.sel = null;
  g.capturing = null;
  g.mathElapsed = 0;
  g.mathStarted = false;
  g.turnElapsed = 0;
  g.tab = 'question';
  g.helpUsed = false;
  g.choices = [];
  g.rerolled = false;
  g.showHints = false;
  g.showHistory = false;
  makeChoices();
  makeMath();
}

/* ---- 05-challenge.js ---- */
/*
 * Défi solo (1 à 100, déplacements « fous » +7, ×2, miroir…), chronométré (3 min) ou sans limite.
 * Le score part de 1000 et baisse avec les tours, aides et erreurs ; les bons calculs
 * donnent des avantages (gel du numéro, combo, +15 s).
 * Contient aussi start(), qui lance toute nouvelle partie.
 */
const CH_TIME = 180000;
/** Meilleurs scores / tours, par défi et par niveau solo. */
function records() {
  try {
    return JSON.parse(localStorage.getItem(RECORDS_STORAGE)) || {};
  } catch (e) {
    return {};
  }
}
/** Clé des records d'un défi : un record par variante et par difficulté. */
const chRecordKey = (kind = g.chKind, diff = g.chDiff) => `${kind}-${diff}`;
/**
 * Score du défi (voir CHALLENGE_SCORE). withBonus ajoute les éléments de fin de partie :
 * pénalité de victoire au filet et bonus des secondes restantes.
 */
function chScore(withBonus = false) {
  const S = CHALLENGE_SCORE,
    n = f => g.history.filter(f).length;
  let sc =
    S.start -
    S.perTurn * g.turn -
    S.question * n(e => e.type === 'question') -
    S.wrongMath * n(e => e.type === 'math' && !e.correct) +
    S.goodMath * n(e => e.type === 'math' && e.correct) -
    S.miss * n(e => e.type === 'wrong') -
    S.netMiss * n(e => e.type === 'netMiss');
  if (withBonus) {
    if (g.last && g.last.type === 'netHit') sc -= S.netWin;
    if (g.chKind === 'timed') sc += S.perSecond * Math.ceil(Math.max(0, CH_TIME - g.chElapsed) / 1000);
  }
  return Math.max(0, sc);
}
/** Durée en m:ss. */
const fmtTime = ms => {
  const sec = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
};
/**
 * Lance un défi ('timed' | 'endless') à la difficulté 'easy' | 'medium' | 'hard',
 * en mémorisant niveau et joueurs pour les restaurer ensuite.
 */
function startChallenge(kind, diff = g.chDiffPref) {
  if (!(diff in CHALLENGE_DIFFS)) diff = 'medium';
  g.playerHelp = [false, false, false, false];
  const prevLevel = g.mode === 'challenge' ? g.prevLevel : g.level,
    prevPlayers = g.mode === 'challenge' ? g.prevPlayers : g.players;
  g.players = 1;
  g.level = CHALLENGE_DIFFS[diff];
  g.chDiffPref = diff;
  start();
  g.mode = 'challenge';
  g.chKind = kind;
  g.chDiff = diff;
  g.prevLevel = prevLevel;
  g.prevPlayers = prevPlayers;
  g.limit = 0;
  g.chElapsed = 0;
  g.chStreak = 0;
  g.netsLeft = [NETS_MAX];
  g.modal = null;
  g.secret = 1 + rnd(100);
  g.candidates = all(100);
  g.shownIds = [];
  prepareTurn();
  sfx('tap');
  render();
}
/** Termine le défi, calcule le score final et enregistre un éventuel record. */
function finishChallenge(won) {
  g.screen = 'end';
  g.inGame = false;
  g.modal = null;
  g.chWon = won;
  g.chSecret = g.last && won ? g.last.n : g.secret;
  g.chFinal = won ? chScore(true) : 0;
  g.chRecordNew = false;
  if (won) {
    const r = records(),
      best = r[chRecordKey()] || 0;
    if (g.chFinal > best) {
      r[chRecordKey()] = g.chFinal;
      g.chRecordNew = true;
      try {
        localStorage.setItem(RECORDS_STORAGE, JSON.stringify(r));
      } catch (e) {}
    }
    sfx('win');
  } else sfx('bad');
}
/** De retour à l'accueil après un défi : rétablit le niveau et le nombre de joueurs d'avant. */
function restoreFromChallenge() {
  if (g.mode === 'challenge') {
    g.mode = 'normal';
    if (g.prevLevel) g.level = g.prevLevel;
    if (g.prevPlayers) g.players = g.prevPlayers;
    g.chKind = null;
  }
}
/**
 * Lance une nouvelle partie en gardant les réglages (langue, son, noms, aides, mode…).
 * Sans skipHandoff, une partie à plusieurs commence par la fenêtre « passe le téléphone ».
 */
function start(skipHandoff = false) {
  const {
    players,
    level,
    lang,
    sound,
    timerMode,
    reduceMotion,
    names,
    replayAsk,
    rpAuto,
    gameMode,
    starter,
    playerHelp,
    showInfo,
    chDiffPref,
    tutSeen
  } = g;
  g = initial();
  g.players = players;
  g.level = level;
  g.lang = lang;
  g.sound = sound;
  g.timerMode = timerMode;
  g.reduceMotion = reduceMotion;
  g.names = names;
  g.replayAsk = replayAsk;
  g.rpAuto = rpAuto;
  g.showInfo = !!showInfo;
  g.tutSeen = !!tutSeen;
  g.chDiffPref = chDiffPref in CHALLENGE_DIFFS ? chDiffPref : 'medium';
  g.gameMode = gameMode === 'score' ? 'score' : 'race';
  g.starter = players > 1 ? (starter || 0) % players : 0;
  g.playerHelp = Array.isArray(playerHelp) ? playerHelp.slice(0, 4) : [false, false, false, false];
  g.mode = 'normal';
  g.gameId = newGameId(); // identifiant stable : les récompenses solo ne sont attribuées qu'une fois
  g.netsLeft = Array(players).fill(NETS_MAX);
  g.screen = 'game';
  g.inGame = true;
  g.modal = players > 1 && skipHandoff !== true ? 'handoff' : null;
  g.limit = [0, 12, 16, 18, 20][players];
  g.secret = 1 + rnd(maxN());
  g.scores = Array(players).fill(0);
  g.stars = Array(players).fill(0);
  g.candidates = all(maxN());
  prepareTurn();
  render();
}

/* ---- 06-career.js ---- */
/*
 * Carrière du mode Solo classique : score d'enquête, records par niveau, XP et rangs.
 *
 * Stockage séparé, versionné : localStorage « numeroEnFuiteCareerV1 ». Les anciennes clés
 * (partie en cours, records de tours `solo_*`, records des défis) ne sont ni remplacées ni purgées.
 *
 * Règles de sûreté :
 *   - chaque partie a un identifiant stable g.gameId (créé par start(), sauvegardé avec la partie) ;
 *   - settleSolo() n'attribue score, étoiles et XP qu'UNE fois par gameId (journal `processed`) :
 *     recharger, rouvrir le résultat ou appuyer sur Retour ne redonne rien ;
 *   - un abandon (Accueil pendant la partie) ne passe jamais par settleSolo() : 0 XP ;
 *   - ne concerne ni les défis, ni Course / Points (plusieurs joueurs).
 */

/** Barème du score Solo (cahier des charges V8.5). Prolonger d'un tour coûte 40, un calcul en rapporte au plus 20. */
const SOLO_SCORE = { win: 100, perTurnSaved: 40, perMath: 20, maxMath: 3, precise: 10, perMiss: 10 };
/** XP de fin de partie. */
const SOLO_XP = { win: 40, recordBonus: 10, loss: 10 };
/** Seuils d'XP des rangs (le libellé est la clé de traduction rank1…rank8). */
const RANKS = [0, 100, 250, 450, 700, 1000, 1400, 1900];
const CAREER_STORAGE = 'numeroEnFuiteCareerV1';
const CAREER_PROCESSED_MAX = 40; // taille du journal des parties déjà comptées

/** Étoiles de rapidité, inchangées : 3 si ≤ 3 tours, 2 si 4 à 6, 1 au-delà ; 0 en cas de défaite. */
const soloStars = (won, turns) => (!won ? 0 : turns <= 3 ? 3 : turns <= 6 ? 2 : 1);

/**
 * Score d'une enquête solo et son détail (lignes affichées sur l'écran de fin).
 * @param {{won:boolean, turns:number, limit:number, goodMath:number, finalCapture:'precise'|'net', misses:number}} p
 */
function scoreSolo({ won, turns, limit, goodMath, finalCapture, misses }) {
  if (!won) return { total: 0, lines: [] };
  const S = SOLO_SCORE,
    saved = Math.max(0, limit - turns),
    math = Math.min(S.maxMath, Math.max(0, goodMath));
  const lines = [
    ['scoreLineWin', S.win, {}],
    ['scoreLineSaved', S.perTurnSaved * saved, { n: saved }],
    ['scoreLineMath', S.perMath * math, { n: math }],
    ['scoreLinePrecise', finalCapture === 'precise' ? S.precise : 0, {}],
    ['scoreLineMiss', -S.perMiss * misses, { n: misses }]
  ].filter(([key, v]) => v !== 0 || key === 'scoreLineWin');
  return {
    total: Math.max(
      0,
      lines.reduce((s, l) => s + l[1], 0)
    ),
    lines
  };
}

/** Rang pour un total d'XP : { rank (1…), min, next (null au dernier rang), pct dans le rang }. */
function rankOf(xp) {
  let i = 0;
  while (i + 1 < RANKS.length && xp >= RANKS[i + 1]) i++;
  const min = RANKS[i],
    next = i + 1 < RANKS.length ? RANKS[i + 1] : null;
  return { rank: i + 1, min, next, pct: next ? Math.round(((xp - min) / (next - min)) * 100) : 100 };
}

const emptyLevel = () => ({ bestScore: null, bestTurns: null, gamesPlayed: 0, wins: 0, stars: 0 });
function emptyCareer() {
  return {
    schemaVersion: 1,
    activeProfileId: 'local-default',
    profiles: {
      'local-default': {
        displayName: 'Détective',
        xpTotal: 0,
        totalWins: 0,
        totalLosses: 0,
        totalStars: 0,
        levels: Object.fromEntries(Object.keys(LEVELS).map(l => [l, emptyLevel()])),
        processed: {} // gameId → résumé déjà attribué (idempotence)
      }
    }
  };
}

/**
 * Lit la carrière ; à la première lecture, migre les meilleurs nombres de tours `solo_*`
 * des records V8.4 (sans inventer de score : bestScore reste null). Une donnée abîmée
 * est complétée champ par champ plutôt que jetée.
 */
function loadCareer() {
  let c = null;
  try {
    c = JSON.parse(localStorage.getItem(CAREER_STORAGE));
  } catch (e) {}
  const fresh = !c || c.schemaVersion !== 1 || !c.profiles;
  if (fresh) c = emptyCareer();
  const p = (c.profiles[c.activeProfileId] = {
    ...emptyCareer().profiles['local-default'],
    ...(c.profiles[c.activeProfileId] || {})
  });
  for (const k of ['xpTotal', 'totalWins', 'totalLosses', 'totalStars'])
    if (!Number.isFinite(p[k]) || p[k] < 0) p[k] = 0;
  if (!p.processed || typeof p.processed !== 'object') p.processed = {};
  p.levels = p.levels || {};
  for (const l of Object.keys(LEVELS)) p.levels[l] = { ...emptyLevel(), ...(p.levels[l] || {}) };
  if (fresh) {
    const r = records();
    for (const l of Object.keys(LEVELS))
      if (Number.isFinite(r['solo_' + l])) p.levels[l].bestTurns = r['solo_' + l];
  }
  return c;
}
const careerProfile = c => c.profiles[c.activeProfileId];
function saveCareer(c) {
  try {
    localStorage.setItem(CAREER_STORAGE, JSON.stringify(c));
  } catch (e) {} // stockage plein ou interdit : le jeu continue
}

/** Identifiant de partie : stable, sauvegardé avec la partie (reprise après fermeture). */
const newGameId = () => Date.now().toString(36) + '-' + rnd(1e9).toString(36);

/**
 * Clôt une partie solo classique (victoire ou défaite après la limite de tours) et renvoie son résumé.
 * Idempotent : un gameId déjà traité renvoie le résumé enregistré, sans rien attribuer de nouveau.
 */
function settleSolo(won) {
  const c = loadCareer(),
    p = careerProfile(c),
    id = g.gameId || newGameId();
  g.gameId = id;
  if (p.processed[id]) return (g.soloResult = p.processed[id]);
  const h = g.history,
    turns = won ? g.turn + 1 : g.limit,
    lv = p.levels[g.level] || (p.levels[g.level] = emptyLevel()),
    score = scoreSolo({
      won,
      turns,
      limit: g.limit || 12,
      goodMath: h.filter(e => e.type === 'math' && e.correct).length,
      finalCapture: g.last && g.last.type === 'netHit' ? 'net' : 'precise',
      misses: h.filter(e => e.type === 'wrong' || e.type === 'netMiss').length
    }),
    stars = soloStars(won, turns),
    prevBest = lv.bestScore,
    newRecord = won && (prevBest == null || score.total > prevBest), // strictement meilleur
    xp = won ? SOLO_XP.win + (newRecord ? SOLO_XP.recordBonus : 0) : SOLO_XP.loss,
    rankBefore = rankOf(p.xpTotal).rank;
  lv.gamesPlayed++;
  if (won) {
    lv.wins++;
    lv.stars += stars;
    p.totalWins++;
    p.totalStars += stars;
    if (newRecord) lv.bestScore = score.total;
    if (lv.bestTurns == null || turns < lv.bestTurns) lv.bestTurns = turns;
  } else p.totalLosses++;
  p.xpTotal += xp;
  const result = {
    won,
    turns,
    level: g.level,
    stars,
    score: score.total,
    lines: score.lines,
    prevBest,
    newRecord,
    xp,
    xpTotal: p.xpTotal,
    rankUp: rankOf(p.xpTotal).rank > rankBefore,
    tip: soloTip(won, turns, stars, g.history, g.last)
  };
  p.processed[id] = result;
  const ids = Object.keys(p.processed);
  for (const old of ids.slice(0, Math.max(0, ids.length - CAREER_PROCESSED_MAX))) delete p.processed[old];
  saveCareer(c);
  return (g.soloResult = result);
}

/** Une seule suggestion pour la prochaine enquête : utile, jamais mensongère (clé + variables). */
function soloTip(won, turns, stars, history, last) {
  const misses = history.filter(e => e.type === 'wrong' || e.type === 'netMiss').length;
  if (!won) return ['tipLoss', {}];
  if (misses >= 2) return ['tipMisses', {}];
  if (stars === 1) return ['tipTwoStars', {}];
  if (stars === 2) return ['tipThreeStars', { n: turns - 3 }];
  if (last && last.type === 'netHit') return ['tipPrecise', {}];
  if (misses === 1) return ['tipNoMiss', {}];
  const order = Object.keys(LEVELS),
    next = order[order.indexOf(g.level) + 1];
  const names = { junior: 'levelJunior', malin: 'levelMalin', expert: 'levelExpert', genius: 'levelGenius' };
  return next ? ['tipNextLevel', { levelKey: names[next] }] : ['tipPerfect', {}];
}

/* ---- 07-timers.js ---- */
/*
 * Chronos. Ils n'avancent que si la partie est visible et qu'aucune fenêtre n'est ouverte
 * (pause, carnet, film…). tick() tourne toutes les 200 ms.
 *   global  : tout le tour (aide + choix du numéro) ; à 0, le tour est perdu et le numéro bouge ;
 *   answer  : choisir une question ; math : répondre au calcul ;
 *   challenge / chUp : défi chronométré (compte à rebours) / sans limite (temps écoulé).
 * Réglage « long » : ×1,5 ; « off » : aucun chrono (hors défi).
 */
/** Durées en secondes, par niveau. */
const LIMITS = {
  junior: { answer: 25, math: 30, global: 75 },
  malin: { answer: 20, math: 30, global: 70 },
  expert: { answer: 20, math: 45, global: 90 },
  genius: { answer: 20, math: 45, global: 100 }
};
const limitOf = k =>
  k === 'challenge'
    ? CH_TIME
    : LIMITS[g.level][k === 'turn' ? 'global' : k] * (g.timerMode === 'long' ? 1.5 : 1) * 1000;
const mathLimit = () => limitOf('math');
const mathLeft = () => Math.max(0, mathLimit() - g.mathElapsed);
const turnLeft = () => Math.max(0, limitOf('global') - g.turnElapsed);
const answerLeft = () => Math.max(0, limitOf('answer') - g.answerElapsed);
/** Chronos visibles en ce moment, du plus général au plus précis. */
function activeTimers() {
  if (g.screen !== 'game' || g.capturing) return [];
  if (g.mode === 'challenge') return [g.chKind === 'timed' ? 'challenge' : 'chUp'];
  if (g.timerMode === 'off' || g.phase !== 'choose' || !g.math) return [];
  const l = ['global'];
  if (!g.helpUsed) {
    if (g.tab === 'math' && g.mathStarted) l.push('math');
    else if (g.tab === 'question') l.push('answer');
  }

}
function timerLeft(k) {

    ? turnLeft()

}

  return k === 'challenge' || k === 'chUp' ? fmtTime(left) : t('seconds', { n: Math.ceil(left / 1000) });
}
/** Barres des chronos ; tick() les met à jour directement, sans render() complet. */
function timersHTML() {
  const l = activeTimers();

    global: ['🕐', t('timerGlobal')],
    answer: ['💬', t('timerAnswer')],
    math: ['🧮', t('timerMathLabel')],
    challenge: ['🏆', t('chTimed')],
    chUp: ['⏱', '']

    .map(k => {

        pct = k === 'chUp' ? 100 : Math.round((left / limitOf(k)) * 100);

let lastTick = Date.now(),
  lastSec = null;
/** Avance les chronos actifs, met à jour les barres, déclenche les fins de temps. */
function tick() {
  const now = Date.now(),
    dt = Math.min(1000, now - lastTick);
  lastTick = now;
  const l = activeTimers();
  if (!l.length || g.modal || document.hidden) return;
  // Défi : le chrono s'arrête pendant la lecture du résultat (temps de lecture non pénalisé).
  if (g.mode === 'challenge' && g.phase !== 'choose') return;
  for (const k of l) {
    if (k === 'global') g.turnElapsed += dt;
    else if (k === 'math') g.mathElapsed += dt;
    else if (k === 'answer') g.answerElapsed += dt;
    else g.chElapsed += dt;
  }
  for (const k of l) {
    const el = document.querySelector(`[data-tk="${k}"]`);
    if (!el) continue;
    const left = timerLeft(k);
    const bar = el.querySelector('.timer-bar span');
    if (bar) bar.style.width = Math.round((left / limitOf(k)) * 100) + '%';
    el.querySelector('b').textContent = timerText(k, left).replace(/&[^;]+;/g, '');
    if (k !== 'chUp') el.classList.toggle('hurry', left <= 5000);
  }
  const urgent = l.filter(k => k !== 'chUp').map(timerLeft);
  if (urgent.length) {
    const sec = Math.ceil(Math.min(...urgent) / 1000);
    if (sec !== lastSec && sec <= 3 && sec > 0) sfx('tap');
    lastSec = sec;
  }
  if (l.includes('challenge') && timerLeft('challenge') <= 0) {
    finishChallenge(false);
    render();
    return;
  }
  if (l.includes('global') && turnLeft() <= 0) {
    turnTimeout();
    return;
  }
  if (l.includes('math') && mathLeft() <= 0) {
    mathTimeout();
    return;
  }
  if (l.includes('answer') && answerLeft() <= 0) {
    answerTimeout();
  }
}
/** Temps écoulé pour la question : l'aide est perdue, il reste à choisir un numéro. */
function answerTimeout() {
  if (g.screen !== 'game' || g.phase !== 'choose' || g.helpUsed) return;
  g.helpUsed = true;
  g.helpKind = null;
  g.answerLost = true;
  g.tab = 'guess';
  sfx('bad');
  render();
}
/** Temps écoulé pour le calcul : compté comme une réponse sans indice. */
function mathTimeout() {
  if (g.screen !== 'game' || g.phase !== 'choose' || g.helpUsed || !g.math) return;
  const player = active();
  g.helpUsed = true;
  g.helpKind = 'math';
  sfx('bad');
  const shift = nextMove();
  g.last = { type: 'math', player, correct: false, timeout: true, answer: null, shift, math: { ...g.math } };

setInterval(tick, 200);
document.addEventListener('touchstart', () => {}, { passive: true });

/* ---- 08-moves.js ---- */
/*
 * Déplacements du numéro et journal de la chasse.
 * Après chaque indice ou tentative ratée, le numéro bouge. Le carnet (g.candidates)
 * subit EXACTEMENT le même déplacement : il reste toujours juste.
 */
const CH_MOVES = [
  { op: '+', k: 7 },
  { op: '+', k: -7 },
  { op: '+', k: 11 },
  { op: '+', k: -13 },
  { op: '+', k: 9 },
  { op: '×', k: 2 },
  { op: '÷', k: 2 },
  { op: 'mirror' }
];
/** Fonction de déplacement : nombre (décalage) ou { op: '+', k } | { op: '×', k } | { op: '÷', k } | { op: 'mirror' }. */
function moveFn(m) {
  const max = maxN();
  if (typeof m === 'number') return n => wrap(n + m, max);
  if (m.op === '+') return n => wrap(n + m.k, max);
  if (m.op === '×') return n => wrap(n * m.k, max);
  if (m.op === '÷') return n => Math.ceil(n / m.k);
  return n => max + 1 - n;
}
/** Déplace le secret et tous les candidats. */
function applyMove(m) {
  const f = moveFn(m);
  g.secret = f(g.secret);
  g.candidates = [...new Set(g.candidates.map(f))].sort((a, b) => a - b);
}
const GENIUS_MOVES = [
  { op: '+', k: 3 },
  { op: '+', k: -3 },
  { op: '+', k: 5 },
  { op: '+', k: -5 },
  { op: '×', k: 2 },
  { op: 'mirror' }
];
/** Tire le prochain déplacement (jamais nul), l'applique et l'ajoute au parcours (film). */
function nextMove() {
  if (!g.hunt) g.hunt = { start: g.secret, steps: [] };
  const from = g.secret;
  let m;
  if (g.mode === 'challenge' || g.level === 'genius') {
    // Un saut annoncé doit vraiment déplacer le numéro : ÷2 sur 1 (1 → 1) ou ×2 sur le maximum
    // (50 → 50) le laisseraient sur place ; on tire alors un autre saut.
    const moves = g.mode === 'challenge' ? CH_MOVES : GENIUS_MOVES;
    for (let tries = 0; tries < 20; tries++) {
      m = { ...pick(moves) };
      if (moveFn(m)(g.secret) !== g.secret) break;
    }
    applyMove(m);
  } else {
    const range = g.level === 'junior' ? 1 : 2;
    m = 0;
    while (m === 0) m = rnd(2 * range + 1) - range;
    applyShift(m);
  }
  g.hunt.steps.push({ from, to: g.secret, shift: m, ev: null });
  return m;
}
/** Ajoute g.last au carnet et l'attache à l'étape du parcours ; une capture clôt le parcours (g.lastHunt). */
function pushHist() {
  const e = { ...g.last };
  g.history.push(e);
  if (!g.hunt) g.hunt = { start: e.type === 'found' || e.type === 'netHit' ? e.n : g.secret, steps: [] };
  const st = g.hunt.steps[g.hunt.steps.length - 1];
  if (e.type === 'found' || e.type === 'netHit') {
    g.lastHunt = { start: g.hunt.start, steps: g.hunt.steps, end: e, max: maxN() };
    g.hunt = null;
    return;
  }
  if (e.frozen) {
    g.hunt.steps.push({ from: g.secret, to: g.secret, shift: 0, frozen: true, ev: e });
    return;
  }
  if (st && !st.ev) st.ev = e;
}
/** Sens d'un déplacement : −1, 0 ou +1 (pour l'animation). */
const moveDir = m => (typeof m === 'number' ? Math.sign(m) : m && m.op === '+' ? Math.sign(m.k) : 0);
/** Décalage simple ±k avec tour complet. */
function applyShift(shift) {
  g.secret = wrap(g.secret + shift, maxN());
  g.candidates = [...new Set(g.candidates.map(n => wrap(n + shift, maxN())))].sort((a, b) => a - b);
}
/** Applique un indice (garde les candidats qui le vérifient) puis fait bouger le numéro. */
function afterClue(test) {
  g.candidates = g.candidates.filter(test);
  return nextMove();
}

/* ---- 09-actions.js ---- */
/*
 * Actions du joueur. Chacune vérifie qu'elle est permise (écran, phase, aide déjà utilisée…)
 * puis modifie `g`, remplit g.last (ce qui vient de se passer) et appelle render().
 * Un tour : au plus UNE aide (question OU calcul), puis UNE capture (tir précis OU filet).
 */

/** Pose la question `id` : réponse oui / non, le carnet se met à jour, le numéro bouge. */
function ask(id) {
  if (g.screen !== 'game' || g.phase !== 'choose' || g.helpUsed || !g.choices.includes(id)) return;
  const q = qbyid(id);
  if (!q) return;
  const player = active(),
    answer = !!q.test(g.secret),
    shift = afterClue(n => q.test(n) === answer);
  g.helpUsed = true;
  g.helpKind = 'question';
  sfx('move');
  g.last = { type: 'question', qid: id, answer, shift, player };
  pushHist();
  g.phase = 'result';
  g.showHints = false;
  render();
}
/** Tir précis sur le numéro n. */
function guess(n) {
  if (g.screen !== 'game' || g.phase !== 'choose' || n < 1 || n > maxN()) return;
  g.sel = null;
  g.capturing = null;
  const player = active(),
    found = n === g.secret;
  sfx(found ? 'win' : 'bad');
  const bonus = g.helpKind === 'question' ? SCORE.deductionBonus : 0;
  if (found) {
    g.scores[player] += SCORE.precise + bonus;
    g.captures++;
    g.last = { type: 'found', player, n, bonus };
    pushHist();
    g.secret = 1 + rnd(maxN());
    g.candidates = all(maxN());
    g.shownIds = [];
    offerReplay();
  } else {
    g.scores[player] += SCORE.miss;
    g.candidates = g.candidates.filter(x => x !== n);
    const shift = nextMove();
    g.last = { type: 'wrong', player, n, shift };
    pushHist();
  }
  g.phase = 'result';
  g.showHints = false;
  render();
}
/* ---- Filet magique : LEVELS[niveau].netSize numéros voisins (2 au niveau Petit, 3 ailleurs). ---- */
// En défi, le filet couvre toujours 3 numéros : « Facile » ne doit pas rendre la capture plus étroite.
const netSize = () => (g.mode === 'challenge' ? 3 : (LEVELS[g.level] || LEVELS.expert).netSize);
/** Numéros couverts par le filet autour de n, sans sortir de 1…max. */
function netRange(n) {
  const k = netSize(),
    max = maxN(),
    first = Math.min(Math.max(1, k === 3 ? n - 1 : n), max - k + 1);
  return Array.from({ length: k }, (_, i) => first + i);
}
/** Lance le filet autour de n (consomme un des NETS_MAX filets du joueur). */
function netCapture(n) {
  if (g.screen !== 'game' || g.phase !== 'choose' || !(n >= 1 && n <= maxN()) || !netAvailable()) return;
  g.netsLeft[active()] = netsLeft() - 1;
  g.sel = null;
  g.capturing = null;
  const nums = netRange(n),
    player = active(),
    hit = nums.includes(g.secret);
  sfx(hit ? 'win' : 'bad');
  const bonus = g.helpKind === 'question' ? SCORE.deductionBonus : 0;
  if (hit) {
    g.scores[player] += SCORE.net + bonus;
    g.captures++;
    g.last = { type: 'netHit', player, n: g.secret, nums, bonus };
    pushHist();
    g.secret = 1 + rnd(maxN());
    g.candidates = all(maxN());
    g.shownIds = [];
    offerReplay();
  } else {
    g.scores[player] += SCORE.miss * nums.length;
    g.candidates = g.candidates.filter(x => !nums.includes(x));
    const shift = nextMove();
    g.last = { type: 'netMiss', player, nums, shift };
    pushHist();
  }
  g.phase = 'result';
  g.showHints = false;
  render();
}
/** Après une capture : propose de revoir le film du parcours (si le réglage le permet). */
function offerReplay() {
  if (g.replayAsk === false) return;
  setTimeout(
    () => {
      if (
        g.screen === 'game' &&
        g.phase === 'result' &&
        g.last &&
        ['found', 'netHit'].includes(g.last.type) &&
        !g.modal &&
        g.lastHunt
      ) {
        g.modal = 'replayAsk';
        render();
      }
    },
    g.reduceMotion ? 60 : 1500
  );
}
/** Bouton de capture : courte animation, puis guess() ou netCapture() sur le numéro sélectionné. */
function launchCapture(mode) {
  if (mode === 'net' && !netAvailable()) return;
  if (g.screen !== 'game' || g.phase !== 'choose' || g.sel == null || g.capturing || g.modal) return;
  const n = g.sel;
  g.capturing = { mode, nums: mode === 'net' ? netRange(n) : [n] };
  sfx(mode === 'net' ? 'net' : 'aim');
  render();
  const go = () => {
    if (!g.capturing) return;
    mode === 'net' ? netCapture(n) : guess(n);
  };
  if (g.reduceMotion) go();
  else setTimeout(go, 800);
}
/** Aide « numéros possibles » : activée joueur par joueur (jamais en défi). */
const helpMode = () =>
  g.mode === 'challenge' ? 'off' : g.playerHelp && g.playerHelp[active()] ? 'auto' : 'off';
const showPossible = () => helpMode() === 'auto' || (helpMode() === 'ask' && g.showHints);
/** Réponse au calcul : juste = étoile + indice (et avantages en défi). */
function mathAnswer(ans) {
  if (g.screen !== 'game' || g.phase !== 'choose' || g.helpUsed || !g.math || !g.math.options.includes(ans))
    return;
  if (g.timerMode !== 'off' && g.mathStarted && mathLeft() <= 0) return mathTimeout();
  const player = active(),
    correct = ans === g.math.result;
  let answer = null;
  if (correct) {
    g.stars[player]++;
    const c = [...g.candidates].sort((a, b) => a - b);
    if (c.length > 1) g.math.threshold = c[Math.floor((c.length - 1) / 2)];
    answer = g.secret > g.math.threshold;
    g.candidates = g.candidates.filter(n => n > g.math.threshold === answer);
  }
  g.helpUsed = true;
  g.helpKind = 'math';
  g.lastPick = ans;
  sfx(correct ? 'good' : 'bad');
  const ch = g.mode === 'challenge',
    frozen = ch && correct;
  let chBonus = 0;
  if (ch) {
    if (correct) {
      g.chStreak = (g.chStreak || 0) + 1;
      chBonus = CHALLENGE_SCORE.goodMath; // le combo (g.chStreak) n'est qu'un effet visuel
      if (g.chKind === 'timed') g.chElapsed = Math.max(0, g.chElapsed - CHALLENGE_SCORE.timeRefundMs);
    } else g.chStreak = 0;
  }
  const shift = frozen ? 0 : nextMove();
  g.last = {
    type: 'math',
    player,
    picked: ans,
    correct,
    answer,
    shift,
    frozen,
    chBonus,
    streak: g.chStreak || 0,
    math: { ...g.math }

  pushHist();
  g.phase = 'result';
  g.showHints = false;
  render();
}
/*
 * Mode Course à plusieurs : un podium plutôt qu'une fin brutale.
 * Celui qui attrape le numéro prend une place ; un nouveau numéro est tiré pour les autres,
 * qui finissent le tour (une capture dans le MÊME tour = même place, ex aequo), puis continuent
 * la chasse pour les places suivantes. Personne n'est privé de son tour.
 */
/** Tour de table en cours (0, 1, 2…) : chaque joueur joue une fois par tour de table. */
const raceRound = () => Math.floor(g.turn / g.players);

const isPlaced = i => (g.placed || []).some(p => p.player === i);
/** Place obtenue par une capture faite pendant le tour de table r (les captures d'un même tour sont ex aequo). */
const placeFor = r => 1 + (g.placed || []).filter(p => p.round < r).length;
/** Fin de la course : premier(s) du podium vainqueur(s). */
function finishRace() {
  const first = g.placed[0];
  g.raceWinner = first ? first.player : null;
  g.raceTurns = first ? first.turn : g.turn;
  g.screen = 'end';
  g.inGame = false;
  g.modal = null;
  sfx('win');
}
/** Bouton « Continuer » : après une aide on reste dans le tour, sinon victoire / fin / joueur suivant. */
function nextTurn() {
  if (g.phase !== 'result') return;
  if (g.last && ['question', 'math'].includes(g.last.type)) {
    g.phase = 'choose';
    g.tab = 'guess';
    g.sel = null;
    g.typed = '';
    g.last = null;
    render();
    return;
  }
  if (g.mode === 'challenge' && g.last && ['found', 'netHit'].includes(g.last.type)) {
    finishChallenge(true);
    render();
    return;
  }
  if (isRace() && g.players > 1 && g.last && ['found', 'netHit'].includes(g.last.type)) {
    // Course : le joueur monte sur le podium (un nouveau numéro a déjà été tiré pour les autres).
    g.placed.push({ player: g.last.player, round: raceRound(), turn: g.turn + 1 });
  }
  if (g.mode !== 'challenge' && g.players === 1 && g.last && ['found', 'netHit'].includes(g.last.type)) {
    g.soloWon = true;
    g.soloTurns = g.turn + 1;
    {
      const k = 'solo_' + g.level,
        r = records(),
        prev = r[k];
      g.soloBest = prev || null;
      g.soloNewRecord = !prev || g.soloTurns < prev;
      if (g.soloNewRecord) {
        r[k] = g.soloTurns;
        try {
          localStorage.setItem(RECORDS_STORAGE, JSON.stringify(r));
        } catch (e) {}
      }
    }
    settleSolo(true); // score, étoiles, record par niveau, XP (une seule fois par partie)
    g.screen = 'end';
    g.inGame = false;
    g.modal = null;
    sfx('win');
    render();
    return;
  }
  const turnBefore = g.turn;
  g.turn++;
  if (isRace() && g.players > 1 && g.placed.length) {
    // les joueurs déjà sur le podium ne jouent plus
    while (g.turn < g.limit && isPlaced(active())) g.turn++;
    const roundEnded = Math.floor(g.turn / g.players) > Math.floor(turnBefore / g.players),
      left = colors.slice(0, g.players).filter((_, i) => !isPlaced(i));
    // fin : tout le monde est placé, ou un tour complet est fini et il reste au plus un chercheur
    if (!left.length || (roundEnded && left.length <= 1) || g.turn >= g.limit) {
      finishRace();
      render();
      return;
    }
  }
  if (g.limit && g.turn >= g.limit) {
    g.raceWinner = null;
    g.soloWon = false;
    g.soloSecret = g.secret;
    if (g.players === 1 && g.mode !== 'challenge') settleSolo(false); // 12 tours joués : +10 XP
    g.screen = 'end';
    g.inGame = false;
    g.modal = null;
    sfx(g.players === 1 ? 'bad' : 'win');
  } else {
    g.phase = 'choose';
    g.last = null;
    prepareTurn();
    if (g.players > 1) g.modal = 'handoff';
  }
  render();
}

/* ---- 10-view-mascot.js ---- */

 * mascot(state) choisit l'animation : idle, think, aim, caught, grimace, dash-left…
 */

const EXPR = {
  idle: 'happy',

  aim: 'curious',
  caught: 'proud',
  proud: 'proud',

}

function quip(key) {

}
function confettiRain() {

}
function confetti() {
  return `<div class="confetti" aria-hidden="true">${Array.from({ length: 22 }, (_, i) => {
    const a = (i / 22) * Math.PI * 2,
      dist = 55 + (i % 4) * 14;
    return `<i style="--x:${Math.round(Math.cos(a) * dist)}px;--y:${Math.round(Math.sin(a) * dist)}px;--r:${(i * 39) % 550}deg;--delay:${(i % 5) * 32}ms;--c:${['#fdbb59', '#fa75a1', '#7d67f4', '#51ceb1', '#80d8ff'][i % 5]}"></i>`;
  }).join('')}</div>`;
}

/** Pastilles des joueurs : score, étoiles, joueur actif. */
function scoreboard() {
  if (g.mode === 'challenge') return '';
  return `<div class="chips" style="grid-template-columns:repeat(${g.players},minmax(0,1fr))">${g.scores.map((s, i) => `<div class="chip ${active() === i ? 'current' : ''} ${g.phase === 'result' && g.last && g.last.player === i && ['found', 'netHit', 'wrong', 'netMiss'].includes(g.last.type) ? 'bump' : ''}"><span class="cname">${isRace() && isPlaced(i) ? `<b class="podium-medal">${['🥇', '🥈', '🥉', '🎖️'][placeFor(g.placed.find(p => p.player === i).round) - 1]}</b>` : ''}<i class="player-dot" style="background:${colors[i]}"></i>${esc(pname(i))}</span><span class="cscore"><b>${s}</b> <small>⭐${g.stars[i]}</small></span>${scoreDelta(i)}</div>`).join('')}</div>`;
}
/** Gain / perte du dernier coup (+10, +4, −1…) affiché sur la pastille. */
function scoreDelta(i) {
  const x = g.last;
  if (g.phase !== 'result' || !x || x.player !== i) return '';

    found: SCORE.precise + (x.bonus || 0),
    netHit: SCORE.net + (x.bonus || 0),
    wrong: SCORE.miss,
    netMiss: SCORE.miss * (x.nums || []).length
  }[x.type];
  return d ? `<i class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${Math.abs(d)}</i>` : '';

function lens(n) {

/**
 * Mini-carnet sous les questions : les 3 derniers indices (questions, calculs justes) sur le numéro EN COURS
 * (depuis la dernière capture), ou une astuce en début de chasse. Masqué sur les écrans bas (CSS).
 */
function miniNotebook() {
  let from = 0;
  g.history.forEach((e, i) => {
    if (e.type === 'found' || e.type === 'netHit') from = i + 1;
  });
  // seulement les INDICES (questions, calculs justes) : ce qui fait vraiment avancer la déduction
  const recent = g.history
    .slice(from)
    .filter(e => e.type === 'question' || (e.type === 'math' && e.correct))
    .slice(-3)
    .reverse();
  return `<div class="mini-notebook">${
    recent.length
      ? `<b>📓 ${t('miniNotebook')}</b>${recent.map(e => `<p>${historyText(e)}</p>`).join('')}`
      : `<p class="tip">${t('miniTip')}</p>`
  }</div>`;
}
/**
 * Saut « à l'aveugle » : montre le TYPE de déplacement (+2, ×2, miroir…) sur une piste
 * sans numéros, pour ne jamais révéler où se cache le numéro.
 */
function blindJump(shift) {
  const s = typeof shift === 'number' ? { op: '+', k: shift } : shift || { op: '+', k: 0 };
  const kind = s.op === '+' ? 'hop' : s.op === '×' ? 'grow' : s.op === '÷' ? 'shrink' : 'mirror';
  const dx = s.op === '+' ? Math.sign(s.k) * Math.min(Math.abs(s.k), 5) * 13 : 0;
  return `<span class="blind-jump ${kind}" dir="ltr" aria-hidden="true" style="--dx:${dx}px"><span class="bj-track">${'<i></i>'.repeat(11)}</span><b class="bj-token">?</b></span><b dir="ltr" class="bj-label">${shiftSymbol(shift)}</b>`;
}
/** Pavé numérique (Génie et défi : trop de numéros pour une grille). */
function keypadHTML() {
  return `<div class="kp-display ${g.sel == null ? 'empty' : ''} ${g.capturing ? 'hit-' + g.capturing.mode : ''}" dir="ltr" aria-live="polite">${g.sel == null ? g.typed || `<span class="kp-range">1–${maxN()}</span>` : g.sel}${g.sel != null && !g.capturing && netAvailable() ? `<small>🕸️ ${netRange(g.sel).join('·')}</small>` : ''}${g.capturing && g.capturing.mode === 'precise' ? '<i class="loupe-fx" aria-hidden="true"></i>' : ''}</div><div class="keypad" dir="ltr">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'clr'].map(k => `<button class="key ${k.length > 1 ? 'fn' : ''}" data-key="${k}" aria-label="${k}" ${k.length === 1 && !keyAllowed(k) ? 'disabled' : ''}>${k === 'del' ? '⌫' : k === 'clr' ? 'C' : k}</button>`).join('')}</div>`;
}
/**
 * Un chiffre n'est utilisable que s'il donne encore un numéro de 1 à maxN() :
 * en Génie (1–50), après « 8 » plus aucun chiffre n'est possible. Impossible de taper « 86 ».
 */
function keyAllowed(k) {
  const n = Number((g.typed || '') + k);
  return n >= 1 && n <= maxN();
}
/** Touche du pavé : chiffre (si autorisé), effacer, tout effacer. */
function pressKey(k) {
  if (g.capturing || g.phase !== 'choose' || g.screen !== 'game') return;
  let v = g.typed || '';
  if (k === 'del') v = v.slice(0, -1);
  else if (k === 'clr') v = '';
  else if (keyAllowed(k)) v = v + k;
  else return;
  const n = Number(v);
  g.typed = v;
  g.sel = v && n >= 1 && n <= maxN() ? n : null;
  sfx('select');
  render();
}

/** Ligne du carnet pour un événement de l'historique. */
function historyText(x) {
  const p = pname(x.player);
  if (x.type === 'question')
    return t('clueLog', {
      player: p,
      question: qbyid(x.qid)?.text || '',
      answer: x.answer ? t('yesAnswer') : t('noAnswer'),

    });
  if (x.type === 'math')
    return t('mathLog', {
      player: p,
      equation: mathText(x.math),
      result: x.math.result,
      outcome: t(x.correct ? 'mathSuccessLog' : x.timeout ? 'mathTimeoutLog' : 'mathFailureLog'),
      shift: shiftSymbol(x.shift)
    });
  if (x.type === 'found') return t('foundLog', { player: p, n: x.n });
  if (x.type === 'timeout') return t('timeoutLog', { player: p, shift: shiftSymbol(x.shift) });
  if (x.type === 'netHit') return t('netHitLog', { player: p, nums: x.nums.join('·') });
  if (x.type === 'netMiss')
    return t('netMissLog', {
      player: p,
      nums: x.nums.join('·'),
      p: x.nums.length,
      shift: shiftSymbol(x.shift)
    });
  return t('wrongLog', { player: p, n: x.n, shift: shiftSymbol(x.shift) });

/** Écran de jeu complet (sans défilement) : barre, scores, détective, chronos, onglets ou résultat. */
function game() {

/** Course : après une capture, place obtenue et annonce du nouveau numéro pour les autres. */
function racePodiumNote(x) {
  if (!isRace() || g.players < 2) return '';
  const place = placeFor(raceRound());
  return `<div class="podium-note">${t('racePlace', { medal: ['🥇', '🥈', '🥉', '🎖️'][place - 1], player: pname(x.player), n: place })}<small>${t('raceNewNumber')}</small></div>`;

/** Classement final de la Course : podium (ordre des captures, ex aequo dans un même tour), puis les autres aux points. */
function raceRanking() {
  const placed = g.placed.map(p => ({ i: p.player, place: placeFor(p.round), turn: p.turn }));
  const others = colors
    .slice(0, g.players)
    .map((_, i) => i)
    .filter(i => !isPlaced(i))
    .map(i => ({ i, v: g.scores[i] + (g.stars[i] || 0) }))
    .sort((a, b) => b.v - a.v);
  const first = placed.length + 1;
  others.forEach((o, k) => (o.place = k && o.v === others[k - 1].v ? others[k - 1].place : first + k));
  return { placed, others };
}

/* ---- 12-replay.js ---- */
/*
 * Film du parcours du numéro (« Revoir l'évasion ») : une étape toutes les RP_STEP ms
 * (ou bouton par bouton), avec le déplacement, le choix de chaque joueur et la capture finale.
 */

let replayTimer = null;
const RP_STEP = 6000;
/** Étapes du film : départ, chaque déplacement (ou gel), capture. */
function rpFrames() {
  const h = g.lastHunt;
  if (!h) return [];
  return [
    { k: 'start', n: h.start },
    ...h.steps.map(st => ({ k: st.frozen ? 'frozen' : 'move', ...st })),
    { k: 'end', n: h.end.n, ev: h.end }
  ];
}
function rpIcon(e) {
  return e
    ? { question: '💡', math: '🧮', wrong: '🎯', netMiss: '🕸️', timeout: '⏱', found: '🎉', netHit: '🕸️' }[
        e.type
      ] || '•'
    : '👣';
}
/** Fenêtre du film pour l'étape g.rpIdx. */
function replayView() {
  const fr = rpFrames(),
    i = Math.min(g.rpIdx || 0, fr.length - 1),
    f = fr[i],
    h = g.lastHunt,
    max = h.max,
    cur = f.k === 'start' || f.k === 'end' ? f.n : f.to;
  const visited = new Set([h.start]);
  for (let j = 1; j <= i; j++) {
    const x = fr[j];
    if (x.k === 'move' || x.k === 'frozen') {
      visited.add(x.from);
      visited.add(x.to);
    }
  }
  const dir = f.k === 'move' ? moveDir(f.shift) : 0,
    anim =
      f.k === 'end'
        ? 'rp-win'
        : f.k === 'frozen'
          ? 'rp-freeze'
          : f.k === 'start'
            ? 'rp-in'
            : dir < 0
              ? 'rp-left'
              : dir > 0
                ? 'rp-right'
                : 'rp-hop';
  let cap = '';
  if (f.k === 'start') cap = '🕵️ ' + t('rpStart', { n: f.n });
  else if (f.k === 'end') cap = '🎉 ' + t('rpCaught', { n: f.n, player: pname(f.ev.player) });
  else {
    let ht = f.ev ? historyText(f.ev) : '';
    const sym = f.ev && f.ev.shift != null ? ' · ' + shiftSymbol(f.ev.shift) : '';
    if (sym && ht.endsWith(sym)) ht = ht.slice(0, -sym.length);
    cap = f.ev ? rpIcon(f.ev) + ' ' + ht : '';
  }
  const shLabel =
    typeof f.shift === 'number'
      ? f.shift > 0
        ? '+' + f.shift
        : '−' + Math.abs(f.shift)
      : f.shift && f.shift.op === '+'
        ? f.shift.k > 0
          ? '+' + f.shift.k
          : '−' + Math.abs(f.shift.k)
        : f.shift && f.shift.op === 'mirror'
          ? '🪞'
          : f.shift
            ? f.shift.op + f.shift.k
            : '';
  const sk = typeof f.shift === 'number' ? f.shift : f.shift && f.shift.op === '+' ? f.shift.k : 0,
    wraps = f.k === 'move' && sk !== 0 && ((sk < 0 && f.to > f.from) || (sk > 0 && f.to < f.from));
  const mv =
    f.k === 'move'
      ? `<div class="rp-move" dir="ltr"><span>${f.from}</span><b class="mv-arrow"><i>${shLabel}</i><em>➜</em></b><span>${f.to}</span></div>` +
        (wraps
          ? `<div class="rp-hint wrap">${t(sk < 0 ? 'mvWrapDown' : 'mvWrapUp', { max })}</div>`
          : moveHint(f.shift)
            ? `<div class="rp-hint">${moveHint(f.shift)}</div>`
            : '')
      : f.k === 'frozen'
        ? `<div class="rp-move frozen">🧊 ${t('rpFrozen', { n: f.to })}</div>`
        : '';
  const ev = f.ev,
    pk =
      ev &&
      (ev.type === 'wrong'
        ? { bad: true, txt: '🎯 ' + ev.n, cells: [ev.n] }
        : ev.type === 'netMiss'
          ? { bad: true, txt: '🕸️ ' + ev.nums.join('·'), cells: ev.nums }
          : ev.type === 'math' && !ev.correct && ev.picked != null
            ? { bad: true, txt: '🧮 ' + ev.picked, cells: [] }
            : ev.type === 'found'
              ? { bad: false, txt: '🎯 ' + ev.n, cells: [ev.n] }
              : ev.type === 'netHit'
                ? { bad: false, txt: '🕸️ ' + ev.nums.join('·'), cells: ev.nums }
                : null);
  const pickHTML = pk
    ? `<div class="rp-pick ${pk.bad ? 'bad' : 'good'}" dir="ltr"><b>${esc(pname(ev.player))}</b> ${pk.txt} ${pk.bad ? '✗' : '✓'}</div>${pk.bad && f.k === 'move' && pk.cells.length ? `<div class="rp-was">${t('rpWas', { n: f.from })}</div>` : ''}`
    : '';
  const pickCells = new Set(pk ? pk.cells : []);
  return `<div class="rp-head"><h2>🎬 ${t('rpTitle')}</h2><span class="rp-step">${t('rpStep', { i: i + 1, n: fr.length })}</span></div>
 <div class="rp-stage ${f.k === 'end' ? 'win' : ''} ${g.reduceMotion ? 'still' : ''}">${f.k === 'move' && !g.reduceMotion ? `<div class="rp-from ${dir < 0 ? 'go-left' : dir > 0 ? 'go-right' : 'go-up'}" dir="ltr">${f.from}</div><div class="rp-trail ${dir < 0 ? 'left' : 'right'}" aria-hidden="true">👣</div>` : ''}<div class="rp-num ${g.reduceMotion ? '' : anim + ' delayed'}" dir="ltr" data-i="${i}">${cur}</div>${pickHTML}${f.k === 'end' && !g.reduceMotion ? confetti() : ''}${g.rpPlaying && i < fr.length - 1 ? `<i class="rp-bar" style="animation-duration:${RP_STEP}ms"></i>` : ''}</div>
 ${mv}<p class="rp-cap">${cap}</p>
 <div class="rp-track ${max > 15 ? 'dense' : ''} ${max > 50 ? 'xdense' : ''}" dir="ltr">${all(max)
   .map(
     n =>
       `<span class="${n === cur ? 'cur' : visited.has(n) ? 'trail' : ''} ${n === h.start ? 'st' : ''} ${pickCells.has(n) ? (pk.bad ? 'miss' : 'hit') : ''}">${max <= 50 || n === cur || visited.has(n) || pickCells.has(n) ? n : ''}</span>`
   )
   .join('')}</div>
 <div class="rp-dots">${fr.map((_, j) => `<i class="${j < i ? 'done' : j === i ? 'on' : ''}"></i>`).join('')}</div>
 <div class="rp-mode" role="radiogroup"><button role="radio" class="${g.rpAuto !== false ? 'on' : ''}" aria-checked="${g.rpAuto !== false}" id="rpModeAuto">▶ ${t('rpAuto')}</button><button role="radio" class="${g.rpAuto === false ? 'on' : ''}" aria-checked="${g.rpAuto === false}" id="rpModeManual">👆 ${t('rpManual')}</button></div><div class="rp-ctrl ${g.rpAuto === false ? 'manual' : ''}" dir="ltr"><button class="key rp-restart" id="rpRestart" aria-label="⏮" title="⏮">⏮</button><button class="key rp-prev" id="rpPrev" aria-label="${t('rpPrev')}" title="${t('rpPrev')}" ${i === 0 ? 'disabled' : ''}><span>◀</span><span class="lbl">${t('rpPrev')}</span></button>${g.rpAuto === false ? '' : `<button class="key rp-play" id="rpPlay" aria-label="⏯">${g.rpPlaying ? '⏸' : '▶'}</button>`}<button class="key rp-next" id="rpNext" ${i >= fr.length - 1 ? 'disabled' : ''}>${t('rpNext')} <span>▶</span></button></div>
 <button class="bigbtn light" id="rpClose">${t('close')}</button>`;
}
/** Programme l'étape suivante en mode automatique (appelée à chaque render()). */
function rpSchedule() {
  clearTimeout(replayTimer);
  if (g.modal !== 'replay' || !g.rpPlaying) return;
  replayTimer = setTimeout(() => {
    if (g.modal !== 'replay' || !g.rpPlaying) return;
    const n = rpFrames().length;
    if ((g.rpIdx || 0) < n - 1) {
      g.rpIdx++;
      sfx(g.rpIdx === n - 1 ? 'win' : 'move');
    }
    if (g.rpIdx >= n - 1) g.rpPlaying = false;
    render();
  }, RP_STEP);
}
function openReplay() {
  g.modal = 'replay';
  g.rpIdx = 0;
  g.rpPlaying = g.rpAuto !== false;
  render();
}
