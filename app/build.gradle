plugins { id 'com.android.application' }

/*
 * Le Numéro en fuite — module Android.
 *
 * L'application est un simple conteneur WebView : tout le jeu est dans
 * src/main/assets/index.html, GÉNÉRÉ par `npm run build` à partir de ../src.
 *
 * APK distribué = variante « release » (non débogable, sans suffixe .debug).
 * Signature lue dans des variables d'environnement, jamais dans le dépôt :
 *   NEF_KEYSTORE_FILE, NEF_KEYSTORE_PASSWORD, NEF_KEY_ALIAS, NEF_KEY_PASSWORD
 * (fournies par la CI à partir des secrets GitHub, voir README « Clé de signature »).
 */
def releaseStore = System.getenv('NEF_KEYSTORE_FILE')
def hasReleaseKey = releaseStore != null && new File(releaseStore).exists()

android {
    namespace 'com.atelier.numeroenfuite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atelier.numeroenfuite'
        minSdk 23
        targetSdk 35
        // Incrémenter les deux à chaque version publiée (versionName alimente aussi le cache de la PWA).
        versionCode 41
        versionName '9.3.1'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('NEF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEF_KEY_ALIAS')
                keyPassword System.getenv('NEF_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            // Pas de code Java à réduire (une seule activité) : R8 n'apporterait rien.
            minifyEnabled false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
